# One-shot alembic upgrade Job.
#
# When to apply:
#   - After deploying a backend image with new migrations against an existing DB.
#   - NOT for fresh installs — those are handled by backend startup (init_db + auto-stamp).
#
# Usage:
#   kubectl -n renfield apply -f k8s/alembic-upgrade-job.yaml
#   kubectl -n renfield logs -f job/alembic-upgrade
#   kubectl -n renfield delete job alembic-upgrade    # remove after success
#
# The Job is idempotent: running it with the DB already at HEAD is a no-op.
apiVersion: batch/v1
kind: Job
metadata:
  name: alembic-upgrade
  namespace: renfield
  labels:
    app.kubernetes.io/part-of: renfield
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: renfield
        # Lets the redis/postgres NetworkPolicy (redis-postgres-netpol.yaml) admit
        # this backend-image Job to Postgres for migrations.
        app.kubernetes.io/component: backend-job
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: alembic
          image: your-registry.example/renfield/backend:latest
          imagePullPolicy: Always
          workingDir: /app
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: renfield-env
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: renfield-secrets
                  key: postgres-password
            # The v2.20.0 boot guard (fail_closed_on_insecure_jwt_key) validates
            # SECRET_KEY at Settings() init — which alembic/env.py triggers by
            # importing models.database. Without this, `alembic upgrade` fails on
            # any AUTH_ENABLED / RENFIELD_ENV=production instance (the household is
            # auth-off, so it never hit this). optional:true = inject-if-present:
            # auth-off installs without the key still run (the guard stays dormant).
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: renfield-secrets
                  key: secret-key
                  optional: true
            - name: DATABASE_URL
              value: postgresql+asyncpg://renfield:$(POSTGRES_PASSWORD)@postgres:5432/renfield
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
