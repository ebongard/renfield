apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: renfield

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - llama-server.yaml
  - llama-server-embed.yaml
  - ollama.yaml
  - searxng.yaml
  - dlna-mcp.yaml
  - samsung-mcp.yaml
  - mdns-responder.yaml
  - backend.yaml
  - frontend.yaml
  - middleware-https-redirect.yaml
  - ingress.yaml
  - external-llm-ingress.yaml
  - backend-tts-cache-route.yaml
  - shared-pvcs.yaml
  - document-worker.yaml
  - redis-postgres-netpol.yaml   # pentest F6: restrict Redis/PG ingress to app pods

labels:
  - pairs:
      app.kubernetes.io/part-of: renfield
    includeSelectors: false
