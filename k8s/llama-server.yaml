apiVersion: v1
kind: Service
metadata:
  name: llama-server-agent
  namespace: renfield
  labels:
    app.kubernetes.io/name: llama-server-agent
    app.kubernetes.io/part-of: renfield
spec:
  selector:
    app.kubernetes.io/name: llama-server-agent
  ports:
    - port: 8080
      targetPort: 8080
      name: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server-agent
  namespace: renfield
  labels:
    app.kubernetes.io/name: llama-server-agent
    app.kubernetes.io/part-of: renfield
spec:
  # Dormant, NOT a working failover. The chat/agent LLM runs outside k8s on
  # the RTX 5090 host (docker container `llama-server`, cuda.local:8081; the
  # definition is in docs/GPU_TOPOLOGY.md §2). Scaling this to 1 does not
  # help: it requests 2 GPUs on k8s-gpu-1, which has one card left (the
  # 5060 Ti failed, Xid 79) and that card is DRA-claimed by Ollama, so the
  # node allocates 0 `nvidia.com/gpu` and the pod would stay Pending. The
  # real fallback when cuda.local is down is LLM_OPENAI_FALLBACK_ENABLED
  # (in-cluster Ollama, see configmap.yaml).
  # Kept only because the `llm-agent-external` Ingress (private_k8s repo)
  # still routes to this Service; retiring it is the owner's decision.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-server-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-server-agent
        app.kubernetes.io/part-of: renfield
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-gpu-1
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: llama-server
          # Pinned: the same build the 5090 host runs (b10423, CUDA 12.8.1).
          # The bare `server-cuda` tag moves with every llama.cpp release.
          image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10423@sha256:a475c08c7c472425e3ebf7f6be9c6cb3a17e82ec28070ddeb22fffe3ca754a94
          imagePullPolicy: IfNotPresent
          args:
            - "-m"
            - "/models/qwen3.6-35b-a3b-q4kxl.gguf"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "-ngl"
            - "99"
            - "--tensor-split"
            - "16,16"
            - "-c"
            - "65536"
            - "--parallel"
            - "4"
            - "-fa"
            - "on"
            - "-ctk"
            - "q8_0"
            - "-ctv"
            - "q8_0"
            - "--temp"
            - "0.6"
            - "--top-p"
            - "0.95"
            - "--alias"
            - "qwen3.6"
            - "--metrics"
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: LLAMA_ARG_N_GPU_LAYERS
              value: "99"
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: 2
            limits:
              cpu: "8"
              memory: 24Gi
              nvidia.com/gpu: 2
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 600
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: models
          hostPath:
            path: /mnt/llm
            type: Directory
