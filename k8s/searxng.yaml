apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: renfield
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/part-of: renfield
spec:
  selector:
    app.kubernetes.io/name: searxng
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: renfield
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/part-of: renfield
data:
  settings.yml: |
    use_default_settings: true
    general:
      instance_name: "Renfield SearXNG"
    server:
      # Override the default of requiring a real secret
      secret_key: "changeme-renfield-searxng"
      bind_address: "0.0.0.0"
      port: 8080
      # limiter MUST stay false: its botdetection blocks non-browser clients and
      # in particular rejects format=json requests — which is exactly how the
      # Renfield backend consumes SearXNG. Turning it on would 0-result our own
      # backend. (It protects an instance from abusive traffic; irrelevant for a
      # private cluster-internal instance reached only by the backend.)
      limiter: false
      image_proxy: false
    search:
      safe_search: 0
      formats:
        - html
        - json      # required: Renfield/LLM consumes JSON
    outgoing:
      request_timeout: 5.0
      max_request_timeout: 10.0
    # Engine retune (2026-08-29): from a single self-hosted IP the big scrapers
    # (Google/Startpage/Brave) get CAPTCHA-blocked, so SearXNG returned HTTP 200
    # with 0 results + unresponsive_engines CAPTCHA errors. Disable those and
    # lean on engines that do NOT bot-block a small independent client
    # (DuckDuckGo, Bing, Mojeek + the already-on Wikipedia). use_default_settings
    # merges this list into the defaults by engine `name`, so unlisted engines
    # keep their default state. No API key, fully self-hosted. If result quality
    # proves thin, add the native `braveapi` engine with a key (PR2 / Option B).
    #
    # Redundancy (2026-08-29 follow-up): DuckDuckGo, like Google/Startpage/Brave,
    # is blocked BY IP from a datacenter/self-hosted egress (DDG changed to
    # IP-reputation blocking in late 2025 — SearXNG issues #4824/#5541, won't-fix:
    # it's not a scraper bug, no config or image upgrade recovers it). We keep DDG
    # enabled as best-effort (it self-recovers after ~1h idle) but must NOT depend
    # on it. So enable several independent CAPTCHA-tolerant general engines — Yahoo
    # + Marginalia on top of Bing/Mojeek/Wikipedia — so any single engine's CAPTCHA
    # is a non-event. (Yandex/Baidu are also CAPTCHA-tolerant but deliberately
    # omitted: routing queries to a Russian/Chinese engine is the wrong privacy
    # posture for this product. Crossref is academic-only, not general web search.)
    # For Google-grade coverage the real lever is a key-based engine (braveapi /
    # the already-working google-cse), NOT scraping from this IP.
    # Brave/Startpage/Qwant are enabled as additional best-effort engines (by
    # request). Honest note: from this datacenter IP Brave-scrape + Startpage are
    # CAPTCHA-prone and Qwant tends to a ~24h suspension, so they often show as
    # unresponsive and self-recover — harmless (each engine has its own network
    # object, so a CAPTCHA on one does NOT suspend Bing/CSE; SearXNG drops
    # unresponsive engines gracefully). google-scrape stays disabled: google-cse
    # already covers it and the raw scraper is the most aggressively IP-blocked.
    engines:
      - name: google
        disabled: true
      - name: startpage
        disabled: false
      - name: brave
        disabled: false
      - name: qwant
        disabled: false
      - name: duckduckgo
        disabled: false
      - name: bing
        disabled: false
      - name: mojeek
        disabled: false
      - name: wikipedia
        disabled: false
      - name: yahoo
        disabled: false
      - name: marginalia
        disabled: false
    ui:
      default_theme: simple

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: renfield
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/part-of: renfield
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
        app.kubernetes.io/part-of: renfield
    spec:
      # Kubernetes' auto-injected service env vars would set SEARXNG_PORT=tcp://…
      # which SearXNG's entrypoint parses as a port number and dies. Suppress them.
      enableServiceLinks: false
      initContainers:
        # Copy ConfigMap settings into a writable dir; SearXNG chowns its settings file
        # on startup, which fails on the read-only ConfigMap mount.
        - name: init-settings
          image: busybox:1.36
          command: ["sh", "-c", "cp /cm/settings.yml /settings/ && chown 977:977 /settings/settings.yml"]
          volumeMounts:
            - name: settings-cm
              mountPath: /cm
            - name: settings
              mountPath: /settings
          securityContext:
            runAsUser: 0
      containers:
        - name: searxng
          # Pinned by digest (2026-08-29) for reproducibility — SearXNG ships
          # rolling date tags and its scraper code shifts every build as upstreams
          # change bot defenses, so :latest could silently alter engine behavior
          # mid-outage. This digest == version 2026.8.29+d226b78bc (the build in
          # use, verified returning results). Bump deliberately to adopt newer
          # engine fixes. An immutable digest makes the pull policy moot.
          image: searxng/searxng@sha256:b36af7984b87191b595bc5301418ed6432c047668a4547ab531a7439b816fac3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SEARXNG_BASE_URL
              value: "http://searxng:8080/"
            - name: INSTANCE_NAME
              value: "Renfield SearXNG"
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: settings-cm
          configMap:
            name: searxng-settings
        - name: settings
          emptyDir: {}
