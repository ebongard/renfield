# Meeting-transcription worker (§2).
#
# Consumes from the `renfield:tasks:meeting` Redis Stream: drives the
# voice-server diarization+ASR on an uploaded recording and ingests the
# speaker-attributed transcript into the KB. Heartbeats to
# `renfield:worker:meeting:heartbeat` so /api/meetings/transcribe can 503
# gracefully when the worker is down.
#
# Sits IDLE until MEETING_TRANSCRIPTION_ENABLED flips on in the backend
# ConfigMap (the route 404s and enqueues nothing while off), same dark-deploy
# pattern as the document worker.
#
# Reads the audio the backend wrote to the shared uploads PVC (path-in-payload,
# never bytes). No OCR/embedding here — the transcript ingest only ENQUEUES the
# transcript Document to the document worker, which does the chunk+embed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meeting-worker
  namespace: renfield
  labels:
    app.kubernetes.io/name: meeting-worker
    app.kubernetes.io/part-of: renfield
spec:
  replicas: 1
  strategy:
    # Never RollingUpdate — a stream consumer group must not have two live
    # consumers overlapping mid-visibility-window (the periodic-reclaim safety
    # relies on replicas:1; see workers/meeting_worker.py).
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: meeting-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meeting-worker
        app.kubernetes.io/part-of: renfield
    spec:
      # A meeting job can run for hours; SIGTERM gets 120s to finish + XACK the
      # in-flight task, else SIGKILL and the Stream PEL + reclaim recover it.
      terminationGracePeriodSeconds: 120
      imagePullSecrets:
        - name: harbor-pull-secret
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "waiting for postgres..."; until nc -z postgres 5432; do sleep 1; done
              echo "waiting for redis...";    until nc -z redis 6379;    do sleep 1; done
              # The meeting worker's downstream is the SHARED voice-server
              # (voice-server consolidation 2026-07). The household reaches it
              # via the NetworkPolicy-fenced anon Service; /transcribe-meeting
              # authenticates through anon_default_client (no X-Voice-Client
              # needed). Matches the backend's VOICE_SERVER_URL.
              echo "waiting for voice-server..."; until nc -z voice-server-anon.voice 8081; do sleep 2; done
              echo "deps ready"
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits:   {memory: 64Mi}
      containers:
        - name: worker
          image: your-registry.example/renfield/backend:latest
          imagePullPolicy: Always
          workingDir: /app
          command: ["python", "-m", "workers.meeting_worker"]
          envFrom:
            - configMapRef: {name: renfield-env}
            # Private per-instance config (out of public git); optional so the
            # pod boots without it. See k8s/renfield-env-private.secret.example.yaml.
            - secretRef: {name: renfield-env-private, optional: true}
            # Redis auth (pentest F6) — REDIS_URL with password overrides the ConfigMap.
            - secretRef: {name: redis-auth, optional: true}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: renfield-secrets, key: postgres-password}
            # SECRET_KEY: the boot guard validates it at Settings() init AND the
            # worker mints a service-account JWT for the pod-to-pod voice-server
            # call (services/meeting_pipeline._service_token). optional:true =
            # inject-if-present (auth-off installs use the config default).
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: {name: renfield-secrets, key: secret-key, optional: true}
            - name: DATABASE_URL
              value: postgresql+asyncpg://renfield:$(POSTGRES_PASSWORD)@renfield-pg-rw:5432/renfield
          volumeMounts:
            # Read the audio the backend streamed here; ingest_document also
            # persists the rendered transcript under this PVC.
            - {name: uploads, mountPath: /app/data/uploads}
            - name: mcp-config
              mountPath: /app/config/mcp_servers.yaml
              subPath: mcp_servers.yaml
              readOnly: true
            - name: mcp-config
              mountPath: /app/config/agent_roles.yaml
              subPath: agent_roles.yaml
              readOnly: true
            - name: mcp-config
              mountPath: /app/config/kg_scopes.yaml
              subPath: kg_scopes.yaml
              readOnly: true
          # No livenessProbe — the Redis heartbeat key is the real liveness
          # signal (checked by the upload route). Same rationale as the
          # document worker; keep the image lean (no procps).
          resources:
            # No OCR/embedding in this pod (that's the document worker); the
            # audio is streamed from disk to the voice-server, so memory stays
            # low. Bursts covered by a modest ceiling.
            requests: {cpu: 250m, memory: 512Mi}
            limits:   {cpu: "1",  memory: 2Gi}
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: renfield-uploads-shared
        - name: mcp-config
          configMap:
            name: renfield-mcp-config
