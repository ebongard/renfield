# renfield-env-private.secret.example.yaml — template for the private-config Secret
#
# These are per-instance config values that must NOT live in public git
# (mailbox addresses, home weather location, private twin endpoints). They were
# historically kubectl-patched onto the live renfield-env ConfigMap; this Secret
# is their reproducible home instead. Consumed via `envFrom: secretRef:
# {name: renfield-env-private, optional: true}` in backend / document-worker /
# meeting-worker (see those manifests).
#
# DO NOT commit real values. Copy to renfield-env-private.secret.yaml
# (git-ignored) and fill in, or apply imperatively (preferred):
#
#   kubectl -n renfield create secret generic renfield-env-private \
#     --from-literal=EMAIL_INGEST_MAILBOXES_JSON='[...]' \
#     --from-literal=KIOSK_WEATHER_LOCATION='<city>' \
#     --from-literal=TWIN_ENABLED='true' \
#     --from-literal=TWIN_SOURCE_APP='renfield' \
#     --from-literal=TWIN_INGEST_URL='https://...' \
#     --from-literal=TWIN_MCP_URL='https://...' \
#     --from-literal=TWIN_RECALL_URL='https://...' \
#     --from-literal=PLUGIN_MCP_BINDINGS='twin_adapter=twin' \
#     --from-literal=PLUGIN_MODULES='<module list>'
---
apiVersion: v1
kind: Secret
metadata:
  name: renfield-env-private
  namespace: renfield
  labels:
    app.kubernetes.io/part-of: renfield
type: Opaque
stringData:
  # Email auto-ingest: JSON array of watched mailboxes (addresses + tier routing).
  EMAIL_INGEST_MAILBOXES_JSON: "CHANGEME"
  # Kiosk weather tile location (env-only, never committed).
  KIOSK_WEATHER_LOCATION: "CHANGEME"
  # Digital-twin integration (private — see docs/private/).
  TWIN_ENABLED: "false"
  TWIN_SOURCE_APP: "renfield"
  TWIN_INGEST_URL: "CHANGEME"
  TWIN_MCP_URL: "CHANGEME"
  TWIN_RECALL_URL: "CHANGEME"
  # Plugin wiring that references the private twin adapter.
  PLUGIN_MCP_BINDINGS: "CHANGEME"
  PLUGIN_MODULES: "CHANGEME"
