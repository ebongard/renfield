apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: renfield
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: renfield
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - port: 8000
      targetPort: 8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: renfield
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: renfield
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: renfield
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      initContainers:
        # Wait for Postgres/Redis/Ollama to be reachable. Schema bootstrap is handled by the
        # backend itself on startup (init_db → Base.metadata.create_all → stamp alembic HEAD
        # for fresh installs). Incremental schema changes on an existing DB are applied via
        # k8s/alembic-upgrade-job.yaml on demand, not at pod start.
        - name: wait-for-deps
          image: busybox:1.36
          command: ["sh", "-c"]
          # The init reads LLM_OPENAI_FALLBACK_ENABLED / WAIT_CUDA_MAX_SECONDS to
          # decide whether the cuda.local wait is strict or time-bounded. Source
          # BOTH the ConfigMap and the private Secret (like the main container),
          # so the flag is honored wherever the operator set it — otherwise a
          # flag in the Secret would leave the boot-gate strict and hang.
          envFrom:
            - configMapRef:
                name: renfield-env
            - secretRef:
                name: renfield-env-private
                optional: true
          args:
            - |
              echo "waiting for postgres..."
              until nc -z postgres 5432; do sleep 1; done
              echo "waiting for redis..."
              until nc -z redis 6379; do sleep 1; done
              # /health on llama-server returns {"status":"ok"} only once the
              # GGUF model is fully loaded (~60-90s cold start). A plain TCP
              # check would pass too early, the backend would start serving,
              # and the first LLM call would 503 until the model warmed up.
              #
              # Agent endpoint moved to cuda.local (RTX 5090) on 2026-05-13 —
              # see reva/docs/architecture/gpu-allocation.md. The in-cluster
              # llama-server-agent is now idle (replicas=0) as failover; if
              # you flip back to that endpoint, re-enable its health check too.
              # In-cluster LLM fallback (utils/llm_client): when LLM_OPENAI_FALLBACK_ENABLED
              # is on, do NOT hard-block the boot on the external llama-server. Wait up to
              # WAIT_CUDA_MAX_SECONDS for a warm model, then proceed — the runtime Ollama
              # fallback covers LLM calls until cuda.local returns. This lets the backend
              # boot during a cuda outage (deploy 2026-08-08) instead of hanging in Init
              # forever. When the fallback is OFF this keeps the strict wait (no 503 on the
              # first LLM call). The flag comes from the renfield-env configMap (envFrom below).
              echo "waiting for cuda.local llama-server /health..."
              # Truthy match the flag the way Pydantic parses it (true/1/yes/on/t/y,
              # any case) — a shell exact "=true" would leave the boot-gate strict
              # while the runtime fallback is on, hanging Init during a cuda outage.
              case "$LLM_OPENAI_FALLBACK_ENABLED" in [Tt][Rr][Uu][Ee]|1|[Yy][Ee][Ss]|[Oo][Nn]|[Tt]|[Yy]) _fb=1;; *) _fb=0;; esac
              if [ "$_fb" = "1" ]; then
                # Guard against a non-numeric WAIT_CUDA_MAX_SECONDS (a "180s" typo).
                _max="${WAIT_CUDA_MAX_SECONDS:-180}"; case "$_max" in ''|*[!0-9]*) _max=180;; esac
                # Bound by WALL-CLOCK (date), not iteration count, AND bound each
                # probe with wget -T: a down host makes an un-timed wget block on
                # the kernel connect timeout, so counting iterations would balloon
                # the "180s" to many minutes — the exact hang this must avoid.
                _start=$(date +%s)
                until wget -T 5 -q -O- http://cuda.local:8081/health 2>/dev/null | grep -q '"ok"'; do
                  if [ $(( $(date +%s) - _start )) -ge "$_max" ]; then
                    echo "cuda.local not ready after ~${_max}s — proceeding (in-cluster fallback covers LLM)"; break
                  fi
                  sleep 2
                done
              else
                until wget -q -O- http://cuda.local:8081/health 2>/dev/null | grep -q '"ok"'; do sleep 2; done
              fi
              # Embeddings moved to the in-cluster ollama service on
              # 2026-05-13 (configmap OLLAMA_EMBED_URL=http://ollama:11434);
              # llama-server-embed is scaled to 0. /api/version confirms the
              # server is up — ollama lazy-loads the embed model on first
              # request and the backend has retry/fallback for the warm-up.
              echo "waiting for ollama embed endpoint..."
              until wget -q -O- http://ollama:11434/api/version 2>/dev/null | grep -q '"version"'; do sleep 2; done
              echo "deps ready"
              # Ensure the persistent HOME exists so Python libs can create
              # their cache dirs there on first run (EasyOCR, HF, torch, whisper).
              mkdir -p /app/data/cache-home/.cache /app/data/cache-home/.EasyOCR
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: cache-home
              mountPath: /app/data/cache-home
      containers:
        - name: backend
          image: your-registry.example/renfield/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          command: ["uvicorn"]
          args: ["main:app", "--host", "0.0.0.0", "--port", "8000"]
          envFrom:
            - configMapRef:
                name: renfield-env
            # Private per-instance config (mailbox JSON, weather location, twin
            # endpoints/bindings) — kept out of public git. optional so a cluster
            # without it still boots with those features dark. See
            # k8s/renfield-env-private.secret.example.yaml.
            - secretRef:
                name: renfield-env-private
                optional: true
            # Redis auth (pentest F6). Its REDIS_URL (with password) overrides the
            # public ConfigMap's passwordless redis://redis:6379. optional so a
            # cluster without it stays passwordless (legacy/dark-safe).
            - secretRef:
                name: redis-auth
                optional: true
          env:
            # Loader prefers this RO mounted key when present (see the
            # federation-identity volumeMount below); falls back to generating at
            # the writable default when the secret isn't provisioned yet.
            - name: FEDERATION_IDENTITY_PERSISTED_KEY_PATH
              value: "/app/federation-identity/federation_identity_key"
            # Digital-twin ingest token (private twin deployment). Declarative
            # here — it used to be injected imperatively via `kubectl set env`,
            # so EVERY re-apply of this manifest dropped it and silently
            # disabled twin capture (the 2026-08-22 review's config-drift
            # fail-open). optional: a cluster without the twin still boots.
            - name: TWIN_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: twin-secrets
                  key: TWIN_INGEST_TOKEN
                  optional: true
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: renfield-secrets
                  key: postgres-password
            - name: DATABASE_URL
              value: postgresql+asyncpg://renfield:$(POSTGRES_PASSWORD)@postgres:5432/renfield
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: renfield-secrets
                  key: secret-key
            - name: DEFAULT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: renfield-secrets
                  key: default-admin-password
            - name: HOME_ASSISTANT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: renfield-secrets
                  key: home-assistant-token
            - name: OPENWEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: renfield-secrets
                  key: openweather-api-key
            # llama-server accepts any non-empty key today, but route the
            # value through a Secret so future swap-in of a real bearer
            # (vLLM, OpenAI, etc.) doesn't require a ConfigMap rewrite.
            - name: LLM_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: renfield-secrets
                  key: llm-openai-api-key
                  optional: true
            - name: NEWSAPI_KEY
              valueFrom:
                secretKeyRef:
                  name: renfield-secrets
                  key: newsapi-key
            - name: JELLYFIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: renfield-secrets
                  key: jellyfin-api-key
            - name: JELLYFIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: renfield-secrets
                  key: jellyfin-token
            - name: JELLYFIN_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: renfield-secrets
                  key: jellyfin-base-url
            - name: JELLYFIN_USER_ID
              valueFrom:
                secretKeyRef:
                  name: renfield-secrets
                  key: jellyfin-user-id
            - name: N8N_API_KEY
              valueFrom:
                secretKeyRef:
                  name: renfield-secrets
                  key: n8n-api-key
            - name: PAPERLESS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: renfield-secrets
                  key: paperless-api-token
            - name: MAIL_REGFISH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: renfield-secrets
                  key: mail-regfish-password
          volumeMounts:
            # Shared with the document-worker pod (#388 cutover). The API
            # writes the uploaded file here, the worker reads it from the
            # same NFS-backed PVC. Must be mounted at the same path on
            # both pods because the DB stores absolute file paths.
            - name: uploads
              mountPath: /app/data/uploads
            # Shared ML model cache (EasyOCR / HuggingFace / Docling).
            # Backend still needs it because chat_upload.py runs Docling
            # in-process; the worker reads from the same cache for the
            # async upload path.
            - name: cache-home
              mountPath: /app/data/cache-home
            # Overlay an ephemeral npm cache on top of the shared
            # cache-home. The MCP stdio servers npx-install on startup,
            # and backend + worker racing on the same .npm tree caused
            # ENOTEMPTY rename errors that made MCP 'search' and 'news'
            # fail on first connect (retries worked, just noisy). Pod-
            # local emptyDir sidesteps the race entirely.
            - name: npm-cache
              mountPath: /app/data/cache-home/.npm
            - name: mcp-config
              mountPath: /app/config/mcp_servers.yaml
              subPath: mcp_servers.yaml
              readOnly: true
            - name: mcp-config
              mountPath: /app/config/agent_roles.yaml
              subPath: agent_roles.yaml
              readOnly: true
            - name: mcp-config
              mountPath: /app/config/kg_scopes.yaml
              subPath: kg_scopes.yaml
              readOnly: true
            # Silences the "Config file not found: /config/mail_accounts.yaml"
            # WARN from renfield-mcp-mail on startup. The shipped default
            # ships `accounts: []`; override by patching this entry in the
            # renfield-mcp-config ConfigMap when real accounts are added.
            - name: mcp-config
              mountPath: /app/config/mail_accounts.yaml
              subPath: mail_accounts.yaml
              readOnly: true
            # Federation Ed25519 identity key — PERSISTED so the pubkey (and thus
            # every peer pairing) survives restarts. The writable default
            # /app/secrets is ephemeral, so without a persisted key it regenerates
            # on each deploy and breaks federation. This mounts the operator-
            # provisioned `federation-identity` Secret as a whole RO dir (NOT
            # subPath: an OPTIONAL subPath secret fails pod creation when absent).
            # FEDERATION_IDENTITY_PERSISTED_KEY_PATH (set below) points the loader
            # at the mounted file; when the secret is absent this is an empty RO
            # dir and the loader falls back to generating ephemerally.
            # Provision with bin/provision_federation_identity.py (NOT a hand
            # `kubectl create --from-file`, which appends a newline → 33 bytes).
            - name: federation-identity
              mountPath: /app/federation-identity
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              # Docling + EasyOCR both moved to the document-worker pod
              # on the hot paths (#388 + chat_upload auto-index
              # follow-up). Backend still runs Docling inline on the
              # user-triggered /api/chat/upload/{id}/index endpoint —
              # rare, but can peak 3-4 GiB on a large PDF. 6 GiB leaves
              # room for baseline (FastAPI + Ollama client + MCP + pool)
              # plus one concurrent sync /index without OOMKill. Could
              # drop to 5 GiB once that endpoint also migrates.
              memory: 6Gi
      volumes:
        # RWX NFS PVCs shared with document-worker — see k8s/shared-pvcs.yaml.
        - name: uploads
          persistentVolumeClaim:
            claimName: renfield-uploads-shared
        - name: cache-home
          persistentVolumeClaim:
            claimName: renfield-cache-shared
        # Pod-local npm cache (see mount comment). 2Gi is generous; npm
        # + all MCP server dependencies typically land around 500 MB.
        - name: npm-cache
          emptyDir:
            sizeLimit: 2Gi
        - name: mcp-config
          configMap:
            name: renfield-mcp-config
        # Persisted federation identity key (see the volumeMount above).
        # optional: true → pods boot even before the secret is provisioned.
        - name: federation-identity
          secret:
            secretName: federation-identity
            optional: true
            defaultMode: 0600
