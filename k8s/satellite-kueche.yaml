# Renfield Satellite — Küche (Orange Pi Zero 3W 4 GB, ReSpeaker XVF3800 USB)
#
# The SECOND k8s-hosted satellite, modelled on k8s/satellite-esszimmer.yaml.
# Pinned to the arm64 node `orangepi-kueche` (fresh vendor image, set up with
# orangepi-node-prep.sh + orangepi-calico-kmods.sh + orangepi-node-resilience.sh).
# No CSI camera on this board, so the camera mounts of the Esszimmer manifest
# are left out.
#
# Why the unusual pod settings:
#  - hostNetwork: zeroconf/mDNS + the WS link to renfield.local need host net
#    (Calico does not forward multicast pod-net <-> host-net).
#  - privileged + /dev/snd + /dev/bus/usb: USB audio (ALSA) and the xvf_host
#    USB LED-control binary need raw device access (pragmatic for a pinned
#    singleton; not a device-plugin).
#  - /run/dbus: BLE presence via bleak talks to the HOST BlueZ over D-Bus.
#  - nodeSelector + toleration: only this satellite lands on the tainted board.
#  - image imported directly into the node containerd (k8s.io ns); pullPolicy
#    Never — no registry round-trip for a node-local single-arch image.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: satellite-kueche-config
  namespace: renfield
  labels:
    app.kubernetes.io/name: satellite-kueche
    app.kubernetes.io/part-of: renfield
data:
  satellite.yaml: |
    satellite:
      id: "sat-kueche"
      room: "Küche"
      language: "de"
    server:
      url: "wss://renfield.local/ws/satellite"
      auto_discover: false
      auth_enabled: false
      verify_tls: false           # ingress uses a self-signed cert
      max_disconnected_seconds: 300
    audio:
      codec: opus                 # C1 binary Opus transport → voice-server /stt-opus
      sample_rate: 16000
      chunk_size: 1280
      channels: 2                 # XVF3800 capture is STEREO (ch0=clean beam, ch1=AEC residual)
      combine: "select"           # pick a single channel (the beam) — no downmix
      select_channel: 0           # ch0 = the clean beamformed stream
      physical_mics: 4            # reported as array-size capability
      use_arecord: false          # USB UAC device; no AC108 in-process crash
      device: "default"           # /etc/asound.conf maps default → plain plug → hw:Array (2ch)
      playback_device: "default"  # → XVF3800 out jack (plain plug); needs a speaker plugged in
      beamforming:
        enabled: false            # XVF3800 does beamforming + AEC in hardware
    wakeword:
      model: "hey_renfield"       # custom model baked into the image (from wohnzimmer)
      threshold: 0.5
      models_path: "/opt/renfield-satellite/models"
    vad:
      backend: "silero"
      silero_threshold: 0.5
      silero_model_path: "/opt/renfield-satellite/models/silero_vad.onnx"
      # Same values as the Ansible fleet (group_vars vad_*). Unset, the code
      # defaults apply — 15 s max recording — and #1282 raised the limit to 60 s
      # only in group_vars, which this pod never reads: a 37 s dictation that the
      # Arbeitszimmer Pi recorded in full was cut here at 15.0 s (2026-09-19).
      silence_duration_ms: 1200
      max_recording_seconds: 60
    led:
      type: "xvf3800"             # LED ring driven via xvf_host over USB
      brightness: 28              # ~90% of the 0-31 scale — the milled (gefräste)
                                  # faceplate needs this to let the ring shine through
      min_brightness: 28          # FLOOR: clamp backend daypart pushes (day=20/
                                  # night=5) UP to 28 so the plate stays lit day AND
                                  # night — else register_ack/night-dimming would
                                  # dim it back below the plate's readable threshold
      xvf_host_path: "/opt/renfield-satellite/bin/xvf_host"
    camera:
      enabled: false             # no CSI camera on this board (Esszimmer has the IMX219)
    button:
      gpio_pin: 17                # no button wired; degrades to no-op without GPIO libs
    ble:
      enabled: true               # board has strong BT; real advertisement RSSI
      scan_interval: 3            # near-continuous (BT5.4, mains power) — was 30
      scan_duration: 7.0          # scan 7s of every ~10s → sub-~10s presence latency
      rssi_threshold: -80
      classic_rssi: false         # AIC8800 raw-HCI (hcitool cc/rssi) is broken here;
                                  # the bleak advertisement scanner provides real RSSI
      continuous: true            # one long-running scanner + EWMA-smoothed RSSI (BT5.4)
      smoothing_alpha: 0.4
      freshness_seconds: 20.0

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: satellite-kueche
  namespace: renfield
  labels:
    app.kubernetes.io/name: satellite-kueche
    app.kubernetes.io/part-of: renfield
spec:
  replicas: 1
  strategy:
    type: Recreate              # singleton bound to one piece of hardware
  selector:
    matchLabels:
      app.kubernetes.io/name: satellite-kueche
  template:
    metadata:
      labels:
        app.kubernetes.io/name: satellite-kueche
        app.kubernetes.io/part-of: renfield
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Deterministic resolution of the backend (Traefik LB) — the pod's DNS
      # (CoreDNS) otherwise may not see the LAN's renfield.local record.
      hostAliases:
        - ip: "192.168.1.230"
          hostnames: ["renfield.local"]
      # Pin to the Orange Pi; tolerate its dedicated taint.
      nodeSelector:
        renfield.io/satellite-room: kueche
      tolerations:
        - key: renfield.io/satellite
          operator: Equal
          value: "true"
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["arm64"]
      containers:
        - name: satellite
          image: renfield/satellite:kueche-v3
          imagePullPolicy: Never   # imported into node containerd (k8s.io ns)
          securityContext:
            privileged: true        # raw /dev access for USB audio + xvf_host
          env:
            - name: RENFIELD_SERVER_URL
              value: "wss://renfield.local/ws/satellite"
            - name: RENFIELD_SATELLITE_ID
              value: "sat-kueche"
            - name: RENFIELD_SATELLITE_ROOM
              value: "Küche"
            - name: RENFIELD_BLE_ENABLED
              value: "true"
            - name: RENFIELD_VERIFY_TLS
              value: "false"
            - name: RENFIELD_AUTO_DISCOVER
              value: "false"
            # Per-satellite enrollment PSK (security H1). Held in a Secret kept
            # out of git; optional so the pod still starts before enrollment is
            # provisioned (PERMISSIVE soak). Create with:
            #   kubectl -n renfield create secret generic satellite-kueche-secret \
            #     --from-literal=enrollment-token="$(bin/enroll_satellite.py sat-kueche ...)"
            - name: RENFIELD_ENROLLMENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: satellite-kueche-secret
                  key: enrollment-token
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /opt/renfield-satellite/config
            - name: snd
              mountPath: /dev/snd
            - name: usb
              mountPath: /dev/bus/usb
            - name: dbus
              mountPath: /run/dbus
            - name: bluetooth
              mountPath: /var/lib/bluetooth
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
      volumes:
        - name: config
          configMap:
            name: satellite-kueche-config
        - name: snd
          hostPath:
            path: /dev/snd
        - name: usb
          hostPath:
            path: /dev/bus/usb
        - name: dbus
          hostPath:
            path: /run/dbus
        # RO read of BlueZ bonding keys — needed to capture an IRK during the UI
        # pairing flow (BlueZ does not expose IRKs over D-Bus).
        - name: bluetooth
          hostPath:
            path: /var/lib/bluetooth
