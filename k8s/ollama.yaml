apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: renfield
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: renfield
spec:
  selector:
    app.kubernetes.io/name: ollama
  ports:
    - port: 11434
      targetPort: 11434

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: renfield
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: renfield
spec:
  # Shared small-models tier for Reva + Renfield (2026-05-13).
  #
  # Hosts four small models that don't justify llama-server's per-model
  # process overhead but benefit from GPU inference:
  #   - llama3.2:3b           ~2 GB  — Reva router, Renfield intent fallback
  #   - qwen3:8b              ~5 GB  — Renfield intent
  #   - qwen3-embedding:4b    ~3 GB  — Renfield embeddings (shared with
  #                                    legacy llama-server-embed until that's
  #                                    retired; see follow-up note)
  #   - nomic-embed-text     ~0.5 GB — Reva embeddings
  # Total resident: ~10 GB.
  #
  # Pinned to k8s-gpu-1. GPU via DRA (Dynamic Resource Allocation), NOT the
  # device plugin — live since 2026-09-03, after the 5060 Ti failed (Xid 79) and
  # was removed: the device plugin could no longer allocate anything on this node.
  #
  # ⚠️ DEPENDS ON a ResourceClaimTemplate named `ollama-gpu-5070ti` in this
  # namespace. It pins the physical card and therefore lives in the operator's
  # PRIVATE infra repo, not here. Without it the pod stays Pending (unresolvable
  # claim) — on purpose: that is loud, whereas a `nvidia.com/gpu` request next to
  # a DRA claim on the same node can hand the same card to two pods silently.
  # Coexistence rule: while this claim is in use, nothing else on k8s-gpu-1 may
  # request `nvidia.com/gpu`.
  #
  # See reva/docs/architecture/gpu-allocation.md for the cluster layout.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        app.kubernetes.io/part-of: renfield
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-gpu-1
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_MODELS
              value: /root/.ollama/models
            # Keep loaded models resident indefinitely. The hot-path
            # small models (llama3.2:3b router, qwen3-embedding:4b)
            # combined fit easily in the 32 GB combined VRAM (5070 Ti
            # + 5060 Ti) so eviction has no upside. Previously 30m,
            # which let Ollama unload between bursts of traffic and
            # added ~12 s cold-load tail latency to router calls.
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "4"
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            # The GPU comes from the pod-level resourceClaims entry below — no
            # `nvidia.com/gpu` here (see the header: never both on this node).
            claims:
              - name: gpu
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "6"
              memory: 16Gi
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: ollama-gpu-5070ti
      volumes:
        - name: models
          hostPath:
            path: /mnt/llm/.ollama
            type: Directory
