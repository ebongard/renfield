# One-shot Job — NOT part of the routine ollama apply (split out of ollama.yaml
# on 2026-09-14). It pre-pulls the small models into the hostPath model store; with
# ttlSecondsAfterFinished it deletes itself a day after finishing, so keeping it in
# ollama.yaml made every re-apply of the Deployment silently re-create the Job and
# re-pull all models, and made `kubectl diff` of ollama.yaml report drift forever.
# Run it by hand only when models are missing (fresh node / wiped store):
#   kubectl -n renfield apply -f k8s/ollama-model-prepull-job.yaml
# One-shot Job: pre-pull models missing from NFS so first backend requests don't stall.
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-model-prepull
  namespace: renfield
  labels:
    app.kubernetes.io/part-of: renfield
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-ollama
          image: curlimages/curl:8.10.1
          command: ["sh", "-c"]
          args:
            - |
              until curl -fsS http://ollama:11434/ > /dev/null; do
                echo "waiting for ollama..."
                sleep 3
              done
              echo "ollama ready"
      containers:
        - name: prepull
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              # Pre-pull the four small models hosted on this Ollama:
              # router (Reva), intent (Renfield), embeddings for both.
              for m in llama3.2:3b qwen3:8b qwen3-embedding:4b nomic-embed-text; do
                echo "Pulling $m ..."
                code=$(curl -sS -o /tmp/out -w '%{http_code}' -X POST http://ollama:11434/api/pull \
                  -H 'Content-Type: application/json' \
                  --max-time 1800 \
                  -d "{\"model\":\"$m\",\"stream\":false}")
                echo "HTTP $code"
                tail -c 400 /tmp/out; echo
                [ "$code" = "200" ] || exit 1
              done
              echo "Done."
