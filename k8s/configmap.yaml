apiVersion: v1
kind: ConfigMap
metadata:
  name: renfield-env
  namespace: renfield
  labels:
    app.kubernetes.io/part-of: renfield
data:
  # === Auth / deployment posture (#697) ===
  # These are set EXPLICITLY (not left to code defaults) so the running posture
  # is auditable from the ConfigMap. Current values = the deliberate single-user,
  # auth-off LAN posture — byte-identical to the code defaults, so setting them
  # here changes nothing today. The consistency validator in utils/config.py
  # (assert_auth_config_consistency) hard-fails on an incoherent combo.
  RENFIELD_ENV: "development"       # NOT "production" — that arms the insecure-JWT-key boot guard; flip only with a strong SECRET_KEY (see cutover below)
  AUTH_ENABLED: "false"            # single-user LAN; the whole multi-user surface is gated on this
  WS_AUTH_ENABLED: "false"        # MUST flip to "true" together with AUTH_ENABLED (validator enforces)
  # This instance federates → require the persisted identity key so a
  # mis-provisioned pod FAILS BOOT (enforce_persistent_identity) instead of
  # silently regenerating ephemerally and breaking pairings a deploy later. Only
  # safe to set "true" AFTER the federation-identity Secret is provisioned
  # (bin/provision_federation_identity.py) — else the boot guard aborts startup.
  FEDERATION_REQUIRE_PERSISTENT_IDENTITY: "true"
  # This instance's own reachable URL, advertised to a peer at pairing so the
  # peer's transport_config gets a usable endpoint (without it a UI pairing yields
  # no endpoint → federation unusable). Same-cluster peers use the internal svc DNS.
  FEDERATION_ADVERTISED_URL: "http://backend.renfield.svc.cluster.local:8000"
  ALLOW_REGISTRATION: "true"       # harmless while auth is off; set "false" at cutover unless self-signup is wanted
  CORS_ORIGINS: "*"               # pin to the frontend origin at cutover
  TRUSTED_PROXIES: ""             # empty = legacy XFF[0] (per-client keying behind Traefik); set to the Traefik pod CIDR for the spoof-resistant walk (#693)
  API_RATE_LIMIT_STORAGE_URI: "memory://"   # per-pod; set to "redis://redis:6379" for shared per-cluster limiting when >1 backend pod runs
  #
  # ── AUTH-ON CUTOVER (xidra multi-user) — do NOT flip piecemeal ──────────────
  # Provision a strong SECRET_KEY (>= 32 random chars) in the renfield-secrets
  # Secret FIRST, then set together:
  #   RENFIELD_ENV: "production"      (arms the SECRET_KEY boot guard — #692)
  #   AUTH_ENABLED: "true"
  #   WS_AUTH_ENABLED: "true"         (required with AUTH_ENABLED — validator hard-fails otherwise)
  #   ALLOW_REGISTRATION: "false"
  #   CORS_ORIGINS: "https://renfield.local"   (or the real origin)
  #   TRUSTED_PROXIES: "<Traefik pod CIDR>"    (verify live: kubectl get pod -n kube-system -l app.kubernetes.io/name=traefik -o wide)
  #   API_RATE_LIMIT_STORAGE_URI: "redis://redis:6379"
  # ────────────────────────────────────────────────────────────────────────────

  # Infra endpoints (cluster-internal DNS)
  DATABASE_URL: "postgresql+asyncpg://renfield:__PG_PASSWORD__@renfield-pg-rw:5432/renfield"
  REDIS_URL: "redis://redis:6379"
  OLLAMA_URL: "http://ollama:11434"
  OLLAMA_EMBED_URL: "http://ollama:11434"
  OLLAMA_VISION_URL: "http://ollama:11434"
  OLLAMA_FALLBACK_URL: ""
  # DLNA MCP runs on hostNetwork (any worker); the `dlna-mcp` Service routes to it.
  DLNA_MCP_URL: "http://dlna-mcp:9091/mcp"
  # Samsung TV MCP — same hostNetwork pattern; the `samsung-mcp` Service routes to it.
  SAMSUNG_MCP_URL: "http://samsung-mcp:9092/mcp"

  # External integrations
  HOME_ASSISTANT_URL: "http://192.168.1.80:8123"
  FRIGATE_URL: "http://frigate.local:5000"          # TODO: resolve to IP when needed
  JELLYFIN_URL: "http://192.168.1.123:8096"
  SEARXNG_API_URL: "http://searxng:8080"            # in-cluster SearXNG pod
  SEARXNG_INSTANCES: "http://searxng:8080"          # consumed by @kevinwatt/mcp-server-searxng
  N8N_API_URL: "https://n8n.home.bongard.dev/api/v1"
  # LAN-direct. The DNS name `paperless.home.bongard.dev` points at a
  # Hostpoint shared-hosting IP (Wildcard A-record leftover) and presents
  # a *.web.hostpoint.ch cert — unusable. Paperless is reachable directly
  # on the cluster subnet.
  PAPERLESS_API_URL: "http://192.168.1.162:8000"

  # OpenAI-compatible LLM endpoints — moved to cuda.local (RTX 5090) on
  # 2026-05-13 per reva/docs/architecture/gpu-allocation.md.
  #   - Chat/Agent/RAG/Intent/KG/Memory → cuda.local:8081 (llama-server with
  #     full Qwen3.6-35B-A3B MoE, shared with Reva). Previous in-cluster
  #     llama-server-agent (Q4 on k8s-gpu-1) is now scaled to 0 — kept as
  #     a fast failover via `kubectl scale --replicas=1`.
  #   - Embeddings → in-cluster Ollama on k8s-gpu-1 GPU (5070 Ti) at
  #     /v1/embeddings. Same qwen3-embedding:4b model, just GPU-served
  #     (10-20x faster than the previous CPU path on k8s-gpu-2).
  #     llama-server-embed deployment is scaled to 0 (replicas=0).
  # Vision tier ENABLED — OLLAMA_VISION_MODEL=qwen3-vl:8b (see below),
  # served by the existing in-cluster `ollama` pod on k8s-gpu-1 (idle
  # 16 GB RTX 5060 Ti). OLLAMA_VISION_URL already routes there, so no
  # separate llama-server-vision pod is needed. Rollback: set the model
  # back to "".
  LLM_OPENAI_BASE_URL: "http://cuda.local:8081/v1"
  # LLM_OPENAI_API_KEY is sourced from the `renfield-secrets`/`llm-openai-api-key`
  # Secret in backend.yaml. llama-server accepts any non-empty value today;
  # the Secret indirection lets us swap to a real bearer (vLLM, OpenAI…)
  # without re-applying this ConfigMap.
  LLM_OPENAI_MODEL: "qwen3.6"
  # Explicit: routes memory extraction through the chat tier (llama-server
  # on cuda.local, Qwen3.6-35B-A3B). Without this, `_get_chat_client()`
  # still resolves to llama-server because LLM_OPENAI_BASE_URL is set, but
  # the model name passed to client.chat() falls back to OLLAMA_MODEL
  # (qwen3:14b) — currently safe because llama-server overrides via
  # --alias, but the configmap reads as misleading. See Agent B audit
  # in reva/docs/architecture/memory-architecture-plan.md.
  MEMORY_EXTRACTION_MODEL: "qwen3.6"
  LLM_OPENAI_EMBED_BASE_URL: "http://ollama:11434/v1"
  LLM_OPENAI_EMBED_MODEL: "qwen3-embedding:4b"

  # In-cluster LLM fallback (PR #1083). When the cuda.local OpenAI-compat
  # chat/agent tier is unreachable (connection-down or cold-model 5xx), the
  # backend fails the turn over to the in-cluster Ollama (OLLAMA_URL) using
  # LLM_OPENAI_FALLBACK_MODEL, and the wait-for-deps init boot-gate becomes
  # time-bounded (WAIT_CUDA_MAX_SECONDS) so the backend still boots during a
  # cuda outage. Enabled here after the 2026-08-09 cuda outages; the in-code
  # default is false (dark).
  LLM_OPENAI_FALLBACK_ENABLED: "true"
  LLM_OPENAI_FALLBACK_MODEL: "qwen3:14b"
  WAIT_CUDA_MAX_SECONDS: "30"

  # Exploit the llama-server's large context window. LLM_OPENAI_NUM_CTX must
  # match the server's --ctx-size (cuda.local:8081 runs 262144); it only
  # widens the backend token budget — the server ignores client num_ctx.
  # The AGENT_*/KNOWLEDGE_* knobs raise the content caps that used to bind
  # long before the budget (history 12×500 chars, tool-result text 8000,
  # knowledge chunks 500). Moderate sizing: typical prompts stay well under
  # ~64k tokens so prefill latency remains interactive. Caveat: during a cuda
  # outage the Ollama fallback still runs at OLLAMA_NUM_CTX — oversized
  # prompts degrade there (logged WARNING), which is acceptable best-effort.
  LLM_OPENAI_NUM_CTX: "262144"
  # Soft-Prompt-Target (#1104): triggert NUR die adaptive Tool-Result-Reduktion
  # (Pass 0) oberhalb dieses Werts, lange bevor das harte 85%-Budget greift —
  # hält Prefill-Latenz interaktiv, ohne Historie/Memory zu opfern.
  AGENT_PROMPT_TARGET_TOKENS: "65536"
  AGENT_CONV_CONTEXT_MESSAGES: "30"
  AGENT_HISTORY_MESSAGE_MAX_CHARS: "2000"
  # Both tool-result knobs must move together: AGENT_RESPONSE_TRUNCATION caps
  # text results at STEP CREATION (before they ever reach the scratchpad),
  # AGENT_TOOL_RESULT_TEXT_MAX_CHARS caps them at prompt-build time — raising
  # only the latter leaves it inert behind the 2000-char creation default.
  AGENT_RESPONSE_TRUNCATION: "32000"
  AGENT_TOOL_RESULT_TEXT_MAX_CHARS: "32000"
  KNOWLEDGE_CONTEXT_CHUNK_CHARS: "1500"

  # H1 Satellite-Enrollment: PERMISSIVE läuft seit 2026-07 (ENABLED via
  # renfield-env-private); der Auto-Flip latcht zu ENFORCING, sobald JEDE
  # enrollte Satellites-Row mindestens einmal authentifiziert hat — Stand
  # 2026-08-22 hält allein sat-benszimmer (frisch enrolled, Token noch nicht
  # provisioniert) den Latch. Nach dessen Provisionierung flippt die Fleet
  # automatisch und dauerhaft (Latch löscht sich nie selbst).
  SATELLITE_ENROLLMENT_AUTOFLIP_ENABLED: "true"
  # H6 fail-closed (2026-08-23): das Backend weigert sich, ein UNSIGNIERTES
  # Release per OTA zu pushen (v1.4.6 ist signiert; bei jeder Satelliten-
  # Quellcode-Änderung neu signieren: bin/sign_satellite_release.py --sign).
  SATELLITE_OTA_REQUIRE_SIGNATURE: "true"

  # Prometheus /metrics (in-cluster only: der Ingress routet /metrics nicht,
  # der Service ist ClusterIP — extern landet der Pfad auf der SPA). Enthält
  # u. a. die MCP-Health-Heartbeats (renfield_mcp_health_ticks_total).
  METRICS_ENABLED: "true"

  # Voice-server (B.4): when set, backend's /api/voice/voice-chat
  # orchestrator delegates STT + TTS to the voice-server pod
  # (k8s-gpu-3) instead of running them in-process. Backend retains
  # the in-process whisper_service + piper_service as a fallback for
  # dev environments without a voice-server deployment until B.4.c
  # removes them.
  # Points at the SHARED voice-server in the `voice` namespace (anon tier for the
  # auth-off household) — the topology-redesign target. Reconciled to the live
  # value 2026-07-25 (git previously lagged at the in-namespace voice-server:8080,
  # which made a full `kubectl apply` clobber the working URL).
  VOICE_SERVER_URL: "http://voice-server-anon.voice:8081"

  # Legacy Ollama model names kept for back-compat with config code paths
  # that read them as defaults. They're NOT used while the LLM_OPENAI_*
  # endpoints are set, except OLLAMA_VISION_MODEL which gates the vision
  # tier (empty = disabled).
  OLLAMA_MODEL: "qwen3:14b"
  OLLAMA_CHAT_MODEL: "qwen3:14b"
  OLLAMA_RAG_MODEL: "qwen3:14b"
  OLLAMA_INTENT_MODEL: "qwen3:8b"
  OLLAMA_EMBED_MODEL: "qwen3-embedding:4b"
  OLLAMA_VISION_MODEL: "qwen3-vl:8b"
  AGENT_MODEL: "qwen3.6"
  EMBEDDING_DIMENSION: "2560"
  # B.4.d: WHISPER_MODEL, PIPER_VOICES, PIPER_DEFAULT_VOICE removed.
  # The voice tier runs in voice-server (k8s-gpu-3) since B.1; backend
  # services only consume STT/TTS via voice_server_client. The
  # in-process Whisper/Piper code paths are gated on
  # `VOICE_SERVER_URL` being unset and exist for local dev only.
  # Pydantic Settings keeps reasonable defaults if anything reads
  # these — the env vars themselves are no longer authoritative.

  # RAG
  RAG_ENABLED: "true"
  RAG_CHUNK_SIZE: "512"
  RAG_CHUNK_OVERLAP: "50"
  RAG_TOP_K: "5"
  RAG_SIMILARITY_THRESHOLD: "0.4"
  # Reranker disabled: the default model (mxbai-rerank-base-v1) isn't in the
  # Ollama registry (never pullable) and _rerank is a bi-encoder cosine pass,
  # not a true cross-encoder — it has always 404'd and fallen back to the RRF
  # order. RRF + lexical fusion is the real ranking. A proper cross-encoder
  # reranker is a separate TODO. (Disabled 2026-05-31.)
  RAG_RERANK_ENABLED: "false"

  # Feature flags
  DEFAULT_LANGUAGE: "de"
  # UI languages selectable + persistable (backend validates the language
  # preference against this list). 'it' added with the Italian locale (#628).
  SUPPORTED_LANGUAGES: "de,en,it"
  AGENT_ENABLED: "true"
  AGENT_ORCHESTRATOR_ENABLED: "true"
  MCP_ENABLED: "true"
  # MCP self-detection (Phase 1): surface MCP failures renfield already detects
  # (Plane-A get_status() degrade/down + Plane-B ingest-MCP OPERATOR-NOTIFY pushes)
  # as ONE deduped proactive admin alert + an internal.system_health entry, instead
  # of dead-ending in logs. Needs PROACTIVE_ENABLED (on here) for the push.
  MCP_HEALTH_MONITOR_ENABLED: "true"
  MEMORY_ENABLED: "true"
  MEMORY_EPISODIC_ENABLED: "true"
  MEMORY_EXTRACTION_ENABLED: "true"
  KNOWLEDGE_GRAPH_ENABLED: "true"
  PRESENCE_ENABLED: "true"
  MEDIA_FOLLOW_ENABLED: "true"
  HA_MCP_ENABLED: "true"
  N8N_MCP_ENABLED: "true"
  EMAIL_MCP_ENABLED: "true"
  DLNA_MCP_ENABLED: "true"
  # Samsung TV ships dark: flip to "true" AFTER the samsung-mcp image is built and
  # the one-time TV pairing is done (see deploy-production skill). URL is wired above.
  SAMSUNG_MCP_ENABLED: "false"
  WEATHER_ENABLED: "true"
  SEARCH_ENABLED: "true"
  NEWS_ENABLED: "true"
  JELLYFIN_ENABLED: "true"
  PAPERLESS_ENABLED: "true"
  RADIO_ENABLED: "true"

  # Agent timeouts
  AGENT_STEP_TIMEOUT: "60"
  AGENT_TOTAL_TIMEOUT: "300"

  # Presentation — URL handed to DLNA renderers / HA media_player to fetch
  # backend-served TTS audio: http://renfield.local/api/voice/tts-cache/...
  # http (not https) because Samsung TVs can't do the self-signed cert; the
  # `backend-tts-cache-http` IngressRoute serves this path plain (no redirect).
  # Renderers resolve renfield.local via DNS (Linn/Samsung) or /etc/hosts
  # (HiFiBerry, see provision-hifiberry.yml). See docs/MESSAGE_RELAY.md.
  ADVERTISE_HOST: "renfield.local"
  ADVERTISE_SCHEME: "http"
  ADVERTISE_PORT: "80"

  # Satellites
  SATELLITE_LATEST_VERSION: "1.3.0"
  # C1 binary Opus transport (docs/design/voice-identity-wakeword-verification.md).
  # Backend-wide "accept opus when a satellite requests it" — safe fleet-wide
  # because it is gated per-satellite by the register handshake (a satellite
  # only streams opus if its own audio.codec: opus is set AND this is on).
  # Enabled 2026-07-07 for the Fitnessraum (XVF3800) canary; all other
  # satellites keep the legacy base64-PCM path until re-provisioned.
  SATELLITE_OPUS_ENABLED: "true"

  # Persist ML model caches (EasyOCR ~/.EasyOCR, HuggingFace ~/.cache/huggingface,
  # Torch ~/.cache/torch, whisper ~/.cache/whisper) across pod restarts by
  # pointing HOME at the /app/data mount (Longhorn PVC today; NFS-CSI RWX
  # PVC after cutover — same path, shared with the document-worker).
  HOME: "/app/data/cache-home"
  HF_HOME: "/app/data/cache-home/.cache/huggingface"

  # Mail MCP account config. Mounted into the backend pod via the
  # renfield-mcp-config ConfigMap — see k8s/backend.yaml. The `/config/`
  # default from config/mcp_servers.yaml doesn't exist in the pod;
  # override to the actual mount path.
  MAIL_ACCOUNTS_CONFIG: "/app/config/mail_accounts.yaml"

  # Logging
  LOG_LEVEL: "INFO"
  DO_NOT_TRACK: "1"

  # === Feature flags backported from live 2026-07-17 (config-drift reconcile) ===
  # These were kubectl-patched onto the live renfield-env ConfigMap over months
  # of feature rollouts and never committed, so git had drifted to a strict
  # subset of prod (42 live-only keys). Backported verbatim here so git is the
  # source of truth again. Sensitive per-instance values (mailbox JSON, weather
  # location, twin endpoints/bindings) are deliberately NOT here — they live in
  # the renfield-env-private Secret, out of public git. See
  # k8s/renfield-env-private.secret.example.yaml. RULE: flip flags in git + apply,
  # never `kubectl patch` the live ConfigMap (that is how this drift happened).
  ARTIFACTS_TYPED_ENABLED: "true"
  BT_SCAN_ENABLED: "true"
  CHAT_BRANCHING_ENABLED: "true"
  CHAT_UPLOAD_CLEANUP_ENABLED: "true"
  COMMAND_PALETTE_ENABLED: "true"
  DOCUMENT_DEDUPE_ENABLED: "true"
  DOCUMENT_DEDUPE_RECURRING_IDENTIFIER_MAX_DOCS: "2"
  DOCUMENT_DEDUPE_TEXT_SIMILARITY_ENABLED: "true"
  DOCUMENT_DEDUPE_TEXT_THRESHOLD: "0.995"
  DUCK_ON_LISTEN_ENABLED: "true"
  EMAIL_INGEST_ENABLED: "true"
  FILES_MCP_ENABLED: "true"
  FOLDER_INGEST_ENABLED: "true"
  FOLLOWUP_CHIPS_ENABLED: "true"
  GRAPH_EXPANSION_ENABLED: "true"
  KG_CONFLATION_MONITOR_ENABLED: "true"
  KG_RECONCILER_ENABLED: "true"
  MEMORY_EXTRACTION_V2_SHADOW: "true"
  MEMORY_KG_BRIDGE_ENABLED: "true"
  MEMORY_SUBSUME_TO_KG: "true"
  MESSAGE_SEARCH_ENABLED: "true"
  NOTES_ENABLED: "true"
  OBLIGATION_DIGEST_ENABLED: "true"
  OBLIGATION_NOTIFIER_ENABLED: "true"
  OUTPUT_PROVIDERS_ENABLED: "true"
  PAPERLESS_AUDIT_ENABLED: "true"
  # Autonomous Paperless dedupe (Scheduled-Task built-in): finds + deletes
  # duplicate Paperless docs (byte-/metadata-identical) to the recoverable
  # trash, keeping the oldest. Self-gates on this flag; needs the scheduled
  # task row active. Rollback: "false".
  PAPERLESS_DEDUPE_RECONCILER_ENABLED: "true"
  # PDF-Split (docs/design/pdf-split.md): Multi-Dokument-Stapelscans beim
  # Ingest erkennen + trennen. VLM-Slow-Lane nutzt OLLAMA_VISION_MODEL (oben
  # gesetzt) und den pdf-split-worker (k8s/pdf-split-worker.yaml). Rollback:
  # auf "false" — der Worker parkt seinen Backlog dann in der PEL.
  PDF_SPLIT_ENABLED: "true"
  # OCR VLM re-OCR fallback for rotated/poor scans (needs OLLAMA_VISION_MODEL, set):
  # when OCR is garbled, the vision model re-transcribes; a fast LM gibberish gate
  # (OLLAMA_INTENT_MODEL) catches the pseudo-word garble char stats can't. See
  # docs/FEATURES.md "Paperless Audit → VLM-Re-OCR-Fallback".
  OCR_VLM_FALLBACK_ENABLED: "true"
  OCR_VLM_GIBBERISH_GATE_ENABLED: "true"
  # Autonomous self-healing sweep: re-enqueue low-coverage docs so the ingest-time
  # VLM coverage trigger recovers them. Drains the backlog, then idles.
  LOW_COVERAGE_REINDEX_ENABLED: "true"
  PROACTIVE_ENABLED: "true"
  PROACTIVE_REMINDERS_ENABLED: "true"
  PROACTIVE_SEMANTIC_DEDUP_ENABLED: "true"
  ROLE_SURFACING_ENABLED: "true"
  ROOM_HANDOFF_ENABLED: "true"
  SATELLITE_ENROLLMENT_ENABLED: "true"
  SCHEDULED_TASKS_ENABLED: "true"
  SCHICHT_A_EXTRACTION_ENABLED: "true"
  SKILLS_ENABLED: "true"
  SKILL_CURATOR_ENABLED: "true"
  SPEAKER_CONTROLLED_ENROLLMENT_ENABLED: "true"
  TOOL_HEALTH_TRACKING_ENABLED: "true"
  TRAJECTORY_CAPTURE_ENABLED: "true"
  WISSEN_WORKSPACE_ENABLED: "true"
  PRESENCE_SWITCH_ENTER_MARGIN_DB: "4"

  # === §2 meeting transcription — flip ON for the household, 2026-07-17 ===
  # Frontend + backend + voice-server all shipped dark; this turns the feature on.
  # The voice-server is the SHARED instance in the `voice` namespace (registry
  # AUTH_MODE, managed in the flux private_k8s repo — NOT this repo); it also
  # needs MEETING_ENABLED=true there. The former per-namespace voice-server
  # (k8s/voice-server.yaml) was retired 2026-08-24 (superseded, scaled to 0).
  MEETING_TRANSCRIPTION_ENABLED: "true"
