# PDF-split slow-lane worker (docs/design/pdf-split.md PR3).
#
# Consumes from the `renfield:tasks:pdfsplit` Redis Stream: per-page VLM
# transcription of garbage pages + multi-window boundary detection for
# multi-document batch scans the inline pre-stage routed here. Heartbeats to
# `renfield:worker:pdfsplit:heartbeat` — the inline pre-stage routes to this
# lane ONLY while that heartbeat is fresh, so an instance without this
# Deployment keeps the status quo (single-document ingest, loud log).
#
# Sits IDLE until PDF_SPLIT_ENABLED flips on in the backend ConfigMap (nothing
# enqueues while off) — same dark-deploy pattern as the meeting worker.
#
# Reads the parent PDF from the shared uploads PVC (path from the Document
# row, never bytes in the payload). No OCR/embedding here — execute_split only
# ENQUEUES the child documents to the document worker.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-split-worker
  namespace: renfield
  labels:
    app.kubernetes.io/name: pdf-split-worker
    app.kubernetes.io/part-of: renfield
spec:
  replicas: 1
  strategy:
    # Never RollingUpdate — a stream consumer group must not have two live
    # consumers overlapping mid-visibility-window (the periodic-reclaim safety
    # relies on replicas:1; see workers/pdf_split_worker.py).
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pdf-split-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pdf-split-worker
        app.kubernetes.io/part-of: renfield
    spec:
      # A bad-scan job can run for many minutes; SIGTERM gets 120s to finish +
      # XACK the in-flight task, else SIGKILL and the Stream PEL + reclaim
      # (row-heartbeat-keyed) recover it.
      terminationGracePeriodSeconds: 120
      imagePullSecrets:
        - name: harbor-pull-secret
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "waiting for postgres..."; until nc -z postgres 5432; do sleep 1; done
              echo "waiting for redis...";    until nc -z redis 6379;    do sleep 1; done
              echo "deps ready"
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits:   {memory: 64Mi}
      containers:
        - name: worker
          image: your-registry.example/renfield/backend:latest
          imagePullPolicy: Always
          workingDir: /app
          command: ["python", "-m", "workers.pdf_split_worker"]
          envFrom:
            - configMapRef: {name: renfield-env}
            # Private per-instance config (out of public git); optional so the
            # pod boots without it. See k8s/renfield-env-private.secret.example.yaml.
            - secretRef: {name: renfield-env-private, optional: true}
            # Redis auth (pentest F6) — REDIS_URL with password overrides the ConfigMap.
            - secretRef: {name: redis-auth, optional: true}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: renfield-secrets, key: postgres-password}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: {name: renfield-secrets, key: secret-key, optional: true}
            - name: DATABASE_URL
              value: postgresql+asyncpg://renfield:$(POSTGRES_PASSWORD)@postgres:5432/renfield
          volumeMounts:
            # Read the parent PDF; execute_split persists the child PDFs here
            # via ingest_document.
            - {name: uploads, mountPath: /app/data/uploads}
            - name: mcp-config
              mountPath: /app/config/mcp_servers.yaml
              subPath: mcp_servers.yaml
              readOnly: true
            - name: mcp-config
              mountPath: /app/config/agent_roles.yaml
              subPath: agent_roles.yaml
              readOnly: true
            - name: mcp-config
              mountPath: /app/config/kg_scopes.yaml
              subPath: kg_scopes.yaml
              readOnly: true
          # No livenessProbe — the Redis heartbeat key is the real liveness
          # signal (checked by the inline pre-stage's routing gate). Same
          # rationale as the other workers; keep the image lean (no procps).
          resources:
            # pdfium rendering + base64 page images in flight; the VLM runs on
            # the Ollama host, not here. Modest ceiling covers big page rasters.
            requests: {cpu: 250m, memory: 512Mi}
            limits:   {cpu: "1",  memory: 2Gi}
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: renfield-uploads-shared
        - name: mcp-config
          configMap:
            name: renfield-mcp-config
