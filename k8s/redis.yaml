apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: renfield
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: renfield
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - port: 6379
      targetPort: 6379

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: renfield
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: renfield
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: renfield
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: renfield
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: renfield
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # requirepass from the redis-auth Secret (pentest F6). Empty/absent
          # password => passwordless (legacy/dark-safe), so a cluster without the
          # Secret still boots unchanged. sh -c so $REDIS_PASSWORD expands.
          command:
            - sh
            - -c
            - exec redis-server --appendonly yes --dir /data --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: REDIS_PASSWORD
                  optional: true
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          # Probes auth with the password when set; fall back to unauth ping when
          # passwordless, so the probe works in both modes.
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping || redis-cli ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping || redis-cli ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
