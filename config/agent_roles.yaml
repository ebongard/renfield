# Agent Role Definitions
# ======================
# Each role defines a specialized agent with filtered tools and step limits.
# The AgentRouter classifies user messages into exactly one role.
#
# Fields:
#   description:     Bilingual description (de/en) shown to the router LLM
#   mcp_servers:     List of MCP server names to include (null = all servers)
#   internal_tools:  List of internal tool names to include (null = all)
#   max_steps:       Maximum agent loop steps for this role
#   prompt_key:      Key in agent.yaml for the role-specific prompt
#   model:           Optional per-role model override (default: AGENT_MODEL or OLLAMA_MODEL)
#   ollama_url:      Optional per-role Ollama URL override (default: AGENT_OLLAMA_URL or OLLAMA_URL)

roles:
  smart_home:
    description:
      de: "Smart Home: Licht, Schalter, Sensoren, Heizung, Szenen steuern, Temperatur/Luftfeuchte in Raeumen abfragen, Bluetooth-Geraete in den Raeumen scannen (NICHT Musik/Medien, NICHT Aussenwetter)"
      en: "Smart home: control lights, switches, sensors, heating, scenes, query temperature/humidity in rooms, scan for Bluetooth devices in the rooms (NOT music/media, NOT outdoor weather)"
    mcp_servers: [homeassistant]
    # internal.media_control is the canonical room-volume path (HA media_players
    # AND DLNA renderers). Volume commands ("lauter/leiser", "auf X% setzen")
    # route here as smart_home/volume_control, so the role needs it — otherwise
    # the agent has no working volume tool (HassSetVolume was removed because it
    # can't target DLNA renderers and bypasses room routing).
    # internal.bluetooth_scan: "scan all bluetooth devices" fans a discovery scan
    # out to every satellite (gated by BT_SCAN_ENABLED).
    # internal.smart_home_overview: the four "read-only smart-home overview" views
    # (status / sensors / active_devices / devices_per_room). These USED to be
    # router short-circuits (dispatch_sub_intent hooks / sub_intents keyword sets)
    # that answered BEFORE the LLM ran — which misfired whenever the fallible router
    # mis-classified a message (e.g. "Wie spät ist es?" → sensors dumped room
    # temperatures instead of the time). They are now this ONE agent-callable tool,
    # so the LLM — seeing the real query + {time_context} — decides when to show an
    # overview. Each view builds a typed Lane A artifact; inert when
    # ARTIFACTS_TYPED_ENABLED is off. No sub_intents block on this role anymore.
    internal_tools: [internal.resolve_room_player, internal.play_in_room, internal.media_control, internal.bluetooth_scan, internal.device_controls, internal.smart_home_overview]
    max_steps: 4
    prompt_key: agent_prompt_smart_home
    model: "qwen3:8b"

  research:
    description:
      de: "Recherche: Websuche, Nachrichten, Aussenwetter/Wettervorhersage (NICHT Raumtemperatur)"
      en: "Research: web search, news, outdoor weather/forecast (NOT room temperature)"
    mcp_servers: [search, news, weather]
    # internal.weather_widget wraps mcp.weather.get_weather + renders a weather
    # widget (prefer it over the raw MCP for weather questions). render_table/
    # render_list let research answers come back as widgets.
    internal_tools: [internal.weather_widget, internal.render_table, internal.render_list]
    max_steps: 6
    prompt_key: agent_prompt_research

  documents:
    description:
      de: "Dokumente und E-Mail: Suche in Wissensdatenbank und Paperless, Download, Versand; SOWIE Verwaltung & Status der Dokument-VERARBEITUNG selbst: Verarbeitungsstatus/Rückstau der Indexierung, wie viele Dokumente KEINE Chunks haben / leer oder unvollständig indexiert sind, Dokumente ohne Chunks NEU INDEXIEREN / neu einlesen / reparieren; SOWIE Paperless-Pflege: DUBLETTEN / doppelte Dokumente finden und aufräumen/löschen"
      en: "Documents and email: search knowledge base and Paperless, download, send; AND administration & status of the document PROCESSING itself: indexing status/backlog, how many documents have NO chunks / are empty or incompletely indexed, RE-INDEX documents without chunks; AND Paperless upkeep: find and clean up/delete DUPLICATE documents"
    mcp_servers: [paperless, email]
    internal_tools: [internal.knowledge_search, internal.forward_attachment_to_paperless, internal.render_table, internal.render_list, internal.ingest_status, internal.reindex_documents, internal.list_chunkless_documents, internal.system_health, internal.reextract_paperless_metadata, internal.paperless_dedupe]
    max_steps: 8
    prompt_key: agent_prompt_documents

  media:
    description:
      de: "Medien: Musik, Filme, Serien, Radio suchen und abspielen (auch in bestimmten Raeumen)"
      en: "Media: search and play music, movies, series, radio (also in specific rooms)"
    mcp_servers: [jellyfin, dlna, radio, samsung]
    internal_tools: [internal.resolve_room_player, internal.play_in_room, internal.play_album_on_dlna, internal.play_video_on_dlna, internal.media_control, internal.play_radio, internal.save_radio_favorite, internal.list_radio_favorites, internal.remove_radio_favorite]
    max_steps: 6
    prompt_key: agent_prompt_media
    model: "qwen3:14b"

  workflow:
    description:
      de: "n8n-Automatisierung NUR: n8n-Workflows / Automations-Pipelines erstellen, bearbeiten, verwalten, ausfuehren. NICHT fuer das Verfassen/Erstellen von Texten, Dokumenten, Fragebögen, Checklisten, Konzepten oder Plänen (das ist 'conversation'/'general') — nicht hierher nur weil 'erstelle' oder 'Programm' vorkommt"
      en: "n8n automation ONLY: create, edit, manage, execute n8n workflows / automation pipelines. NOT for writing/creating text, documents, questionnaires, checklists, concepts or plans (that is 'conversation'/'general') — not here just because the words 'create' or 'program' appear"
    mcp_servers: [n8n]
    max_steps: 10
    prompt_key: agent_prompt_workflow

  presence:
    description:
      de: "Anwesenheit & Nachrichten ausrichten: Wo ist eine Person, wer ist zuhause, in welchem Raum ist jemand; einer Person etwas ausrichten/Bescheid sagen/ansagen ('sag ihm/ihr ...', 'richte X aus'); ODER eine Rundansage an ALLE im Haus ('Ansage an alle', 'sag allen Bescheid', 'ruf alle zum Essen', 'Durchsage')"
      en: "Presence & relaying messages: where is a person, who is home, which room is someone in; relay/announce a message to a person ('tell him/her ...', 'let X know ...'); OR a house-wide announcement to EVERYONE ('announce to all', 'tell everyone', 'call everyone for dinner')"
    mcp_servers: []
    internal_tools: [internal.get_user_location, internal.get_all_presence, internal.announce_in_room, internal.broadcast_announcement, internal.presence_history, internal.presence_map]
    max_steps: 5
    prompt_key: agent_prompt

  routine:
    description:
      de: "Routinen: Gute-Nacht-Routine, Guten-Morgen-Routine, Schlafenszeit, Aufstehen — mehrstufige Smart-Home-Ablaeufe mit Statusbericht"
      en: "Routines: good-night routine, good-morning routine, bedtime, waking up — multi-step smart home sequences with status briefing"
    mcp_servers: [homeassistant, calendar, weather, jellyfin, dlna, radio, samsung]
    internal_tools: [internal.get_all_presence, internal.get_user_location, internal.resolve_room_player, internal.media_control, internal.play_in_room, internal.play_radio, internal.weather_widget]
    max_steps: 15
    prompt_key: agent_prompt_routine

  knowledge:
    description:
      de: "Wissensdatenbank: INHALTLICHE Suche in eigenen hochgeladenen Dokumenten (was steht in einem Dokument, Fakten/Inhalte AUS Dokumenten). NICHT für Verwaltungs-/Statusfragen zur Verarbeitung selbst (Chunks, Indexierungsstatus, neu indexieren) — das ist 'documents'"
      en: "Knowledge base: CONTENT search in own uploaded documents (what a document says, facts/content FROM documents). NOT for administration/status questions about the processing itself (chunks, indexing status, re-index) — that is 'documents'"
    # No agent loop - uses RAG path directly

  general:
    description:
      de: "Allgemein: Komplexe oder domainuebergreifende Anfragen; AUCH das Anlegen einer zeitbasierten ERINNERUNG/eines Reminders ('erinnere mich in X Minuten/Stunden daran ...', 'erinnere mich um HH:MM an ...'); AUCH wenn der Nutzer Daten oder Fakten ausdruecklich als LISTE oder TABELLE dargestellt haben moechte (z.B. 'liste ... auf', 'zeig mir eine Liste/Tabelle von ...', 'erstelle eine Tabelle mit/der ...', 'vergleiche ... als Tabelle')"
      en: "General: complex or cross-domain queries; ALSO setting a time-based REMINDER ('remind me in X minutes/hours to ...', 'remind me at HH:MM to ...'); ALSO when the user explicitly wants data or facts shown as a LIST or TABLE (e.g. 'list ...', 'show me a list/table of ...', 'create a table of ...', 'compare ... as a table')"
    mcp_servers: null
    internal_tools: null
    max_steps: 12
    prompt_key: agent_prompt

  conversation:
    description:
      de: "Konversation & Texterstellung: Smalltalk, Allgemeinwissen, Meinungen, sowie das Verfassen/Erstellen von Texten, Dokumenten, Fragebögen, Checklisten, Konzepten, Plänen, Vorlagen — KEINE Aktion und KEINE Weitergabe einer Nachricht an eine Person (eine Nachricht ausrichten gehoert zu 'presence'). NICHT hierher, wenn der Nutzer Daten/Fakten ausdruecklich als LISTE oder TABELLE dargestellt haben moechte (das gehoert zu 'general')"
      en: "Conversation & writing: smalltalk, general knowledge, opinions, and writing/creating text, documents, questionnaires, checklists, concepts, plans, templates — NO action and NOT relaying a message to a person (relaying a message belongs to 'presence'). NOT here when the user explicitly wants data/facts shown as a LIST or TABLE (that belongs to 'general')"
    # No agent loop - direct LLM response
