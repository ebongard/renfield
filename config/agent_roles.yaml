# Agent Role Definitions
# ======================
# Each role defines a specialized agent with filtered tools and step limits.
# The AgentRouter classifies user messages into exactly one role.
#
# Fields:
#   description:     Bilingual description (de/en) shown to the router LLM
#   mcp_servers:     List of MCP server names to include (null = all servers)
#   internal_tools:  List of internal tool names to include (null = all)
#   max_steps:       Maximum agent loop steps for this role
#   prompt_key:      Key in agent.yaml for the role-specific prompt
#   model:           Optional per-role model override (default: AGENT_MODEL or OLLAMA_MODEL)
#   ollama_url:      Optional per-role Ollama URL override (default: AGENT_OLLAMA_URL or OLLAMA_URL)

roles:
  smart_home:
    description:
      de: "Smart Home: Licht, Schalter, Sensoren, Heizung, Szenen steuern, Temperatur/Luftfeuchte in Raeumen abfragen, Bluetooth-Geraete in den Raeumen scannen (NICHT Musik/Medien, NICHT Aussenwetter)"
      en: "Smart home: control lights, switches, sensors, heating, scenes, query temperature/humidity in rooms, scan for Bluetooth devices in the rooms (NOT music/media, NOT outdoor weather)"
    mcp_servers: [homeassistant]
    # internal.media_control is the canonical room-volume path (HA media_players
    # AND DLNA renderers). Volume commands ("lauter/leiser", "auf X% setzen")
    # route here as smart_home/volume_control, so the role needs it — otherwise
    # the agent has no working volume tool (HassSetVolume was removed because it
    # can't target DLNA renderers and bypasses room routing).
    # internal.bluetooth_scan: "scan all bluetooth devices" fans a discovery scan
    # out to every satellite (gated by BT_SCAN_ENABLED).
    internal_tools: [internal.resolve_room_player, internal.play_in_room, internal.media_control, internal.bluetooth_scan]
    max_steps: 4
    prompt_key: agent_prompt_smart_home
    model: "qwen3:8b"
    # Sub-intent dispatch: four "read-only smart-home overview" requests are fully
    # handled by ha_glue `dispatch_sub_intent` hooks, each returning prose + ONE
    # typed Lane A artifact. Actuation commands ("mach das Licht an") match NONE of
    # these keyword sets (no actuation verbs appear) and fall through to the normal
    # agent loop. Every handler is inert when ARTIFACTS_TYPED_ENABLED is off
    # (declines → agent answers).
    # NOTE: each description string doubles as comma-separated keywords for the
    # router's _infer_sub_intent fast-path (the sub-intent with the MOST keyword
    # hits wins), so the keyword sets are kept disjoint per sub-intent:
    #   status         → table    (full device inventory, room×device×state)
    #   sensors        → keyvalue  (per-room temperature/humidity readings)
    #   active_devices → list      (controllable devices currently on)
    #   devices_per_room → chart   (bar: device count per room)
    # "was ist an / was ist gerade an" deliberately lives ONLY on active_devices
    # (its true meaning) so it never collides with the status overview.
    sub_intents:
      status:
        de: "Status, Übersicht, Überblick, Zustand, wie ist der status im haus, smart-home-status, geräteübersicht, alle geräte anzeigen, gesamtüberblick"
        en: "status, overview, summary, state of the house, smart home status, device overview, show all devices, whole house status"
        dispatch:
          type: handler
          handler: smarthome_status
      sensors:
        de: "Sensorwerte, Temperaturen, Temperatur in den räumen, wie warm ist es, wie warm ist es in den räumen, luftfeuchte, luftfeuchtigkeit, raumtemperatur, messwerte"
        en: "sensor readings, temperatures, temperature in the rooms, how warm is it, how warm is it in the rooms, humidity, air humidity, room temperature, measured values"
        dispatch:
          type: handler
          handler: smarthome_sensors
      active_devices:
        de: "Was ist gerade an, was ist an, was läuft gerade, welche geräte sind eingeschaltet, was ist eingeschaltet, welche geräte laufen, was ist aktiv"
        en: "what is on, what is currently on, what is running, which devices are switched on, which devices are on, which devices are running, what is active"
        dispatch:
          type: handler
          handler: smarthome_active_devices
      devices_per_room:
        de: "Geräte pro Raum, wie viele geräte pro raum, anzahl geräte je raum, geräteverteilung, wie viele geräte gibt es pro raum, geräte je raum"
        en: "devices per room, how many devices per room, device count per room, device distribution, how many devices are there per room, devices by room"
        dispatch:
          type: handler
          handler: smarthome_devices_per_room

  research:
    description:
      de: "Recherche: Websuche, Nachrichten, Aussenwetter/Wettervorhersage (NICHT Raumtemperatur)"
      en: "Research: web search, news, outdoor weather/forecast (NOT room temperature)"
    mcp_servers: [search, news, weather]
    max_steps: 6
    prompt_key: agent_prompt_research

  documents:
    description:
      de: "Dokumente und E-Mail: Suche in Wissensdatenbank und Paperless, Download, Versand"
      en: "Documents and email: search knowledge base and Paperless, download, send"
    mcp_servers: [paperless, email]
    internal_tools: [internal.knowledge_search, internal.forward_attachment_to_paperless]
    max_steps: 8
    prompt_key: agent_prompt_documents

  media:
    description:
      de: "Medien: Musik, Filme, Serien, Radio suchen und abspielen (auch in bestimmten Raeumen)"
      en: "Media: search and play music, movies, series, radio (also in specific rooms)"
    mcp_servers: [jellyfin, dlna, radio, samsung]
    internal_tools: [internal.resolve_room_player, internal.play_in_room, internal.play_album_on_dlna, internal.play_video_on_dlna, internal.media_control, internal.play_radio, internal.save_radio_favorite, internal.list_radio_favorites, internal.remove_radio_favorite]
    max_steps: 6
    prompt_key: agent_prompt_media
    model: "qwen3:14b"

  workflow:
    description:
      de: "n8n-Automatisierung NUR: n8n-Workflows / Automations-Pipelines erstellen, bearbeiten, verwalten, ausfuehren. NICHT fuer das Verfassen/Erstellen von Texten, Dokumenten, Fragebögen, Checklisten, Konzepten oder Plänen (das ist 'conversation'/'general') — nicht hierher nur weil 'erstelle' oder 'Programm' vorkommt"
      en: "n8n automation ONLY: create, edit, manage, execute n8n workflows / automation pipelines. NOT for writing/creating text, documents, questionnaires, checklists, concepts or plans (that is 'conversation'/'general') — not here just because the words 'create' or 'program' appear"
    mcp_servers: [n8n]
    max_steps: 10
    prompt_key: agent_prompt_workflow

  presence:
    description:
      de: "Anwesenheit & Nachrichten ausrichten: Wo ist eine Person, wer ist zuhause, in welchem Raum ist jemand; einer Person etwas ausrichten/Bescheid sagen/ansagen ('sag ihm/ihr ...', 'richte X aus')"
      en: "Presence & relaying messages: where is a person, who is home, which room is someone in; relay/announce a message to a person ('tell him/her ...', 'let X know ...')"
    mcp_servers: []
    internal_tools: [internal.get_user_location, internal.get_all_presence, internal.announce_in_room, internal.presence_history]
    max_steps: 5
    prompt_key: agent_prompt

  routine:
    description:
      de: "Routinen: Gute-Nacht-Routine, Guten-Morgen-Routine, Schlafenszeit, Aufstehen — mehrstufige Smart-Home-Ablaeufe mit Statusbericht"
      en: "Routines: good-night routine, good-morning routine, bedtime, waking up — multi-step smart home sequences with status briefing"
    mcp_servers: [homeassistant, calendar, weather, jellyfin, dlna, radio, samsung]
    internal_tools: [internal.get_all_presence, internal.get_user_location, internal.resolve_room_player, internal.media_control, internal.play_in_room, internal.play_radio]
    max_steps: 15
    prompt_key: agent_prompt_routine

  knowledge:
    description:
      de: "Wissensdatenbank: Suche in eigenen hochgeladenen Dokumenten"
      en: "Knowledge base: search in own uploaded documents"
    # No agent loop - uses RAG path directly

  general:
    description:
      de: "Allgemein: Komplexe oder domainuebergreifende Anfragen"
      en: "General: complex or cross-domain queries"
    mcp_servers: null
    internal_tools: null
    max_steps: 12
    prompt_key: agent_prompt

  conversation:
    description:
      de: "Konversation & Texterstellung: Smalltalk, Allgemeinwissen, Meinungen, sowie das Verfassen/Erstellen von Texten, Dokumenten, Fragebögen, Checklisten, Konzepten, Plänen, Vorlagen — KEINE Aktion und KEINE Weitergabe einer Nachricht an eine Person (eine Nachricht ausrichten gehoert zu 'presence')"
      en: "Conversation & writing: smalltalk, general knowledge, opinions, and writing/creating text, documents, questionnaires, checklists, concepts, plans, templates — NO action and NOT relaying a message to a person (relaying a message belongs to 'presence')"
    # No agent loop - direct LLM response
