# Development Nginx config (HTTP only, no SSL)
# Use for testing reverse proxy without SSL certificates

events {
    worker_connections 1024;
}

http {
    # Access log WITHOUT the query string: the default format logs `$request`,
    # which carries `/ws?token=<JWT>` (Bearer mode) and `/auth/callback?code=`.
    # Same format as src/frontend/nginx.conf; the Referer loses its query too.
    map $request_uri $renfield_log_path {
        "~^(?<renfield_req_path>[^?]*)" $renfield_req_path;
        default                         "-";
    }
    map $http_referer $renfield_log_referer {
        "~^(?<renfield_ref_path>[^?#]*)" $renfield_ref_path;
        default                          "-";
    }
    log_format renfield_noquery '$remote_addr - $remote_user [$time_local] '
                                '"$request_method $renfield_log_path $server_protocol" $status $body_bytes_sent '
                                '"$renfield_log_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log renfield_noquery;

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend API
        location /api {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout für langsame Whisper-Transkription
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }

        # WebSocket für Chat und Satellite
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket Timeout (24h für lang laufende Verbindungen)
            proxy_read_timeout 86400;
        }

        # Health Check
        location /health {
            proxy_pass http://backend;
            access_log off;
        }
    }
}
