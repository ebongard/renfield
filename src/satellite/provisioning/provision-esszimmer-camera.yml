---
# Renfield A733 satellite CAMERA host-side provisioning (Esszimmer / Orange Pi Zero 3W).
#
# WHY this exists
# ---------------
# The Esszimmer satellite runs as a Kubernetes POD (k8s/satellite-esszimmer.yaml), not
# as a bare-metal app like the Pi Zero 2 W satellites. But a CSI camera needs HOST-level
# pieces a pod cannot provide — a device-tree overlay, a kernel module autoload, and the
# Allwinner ISP userspace + capture tool. This playbook makes those reproducible so a
# reflash/replacement of the node restores the camera. (The POD side — the /dev/video0,
# /dev/media0 and /opt/awisp hostPath mounts — stays in the git-managed k8s manifest.)
#
# This is the ONLY camera in the fleet: the bare-metal `satellites` group has no A733/ISP.
# So this is a separate play targeting the `camera_satellites` group (the Orange Pi k8s
# node, root login) — see inventory.example.yml.
#
# IDEMPOTENT + re-runnable. A REBOOT is required after the overlay is first installed
# (for /dev/video0 to appear); this play does NOT auto-reboot unless `camera_reboot=true`.
#
# PREREQUISITE — proprietary Allwinner ISP libs (NOT in git):
#   Stage these on the CONTROL machine under files/awisp/ (git-ignored):
#     files/awisp/libAWIspApi.so  files/awisp/libisp.so  files/awisp/libisp_ini.so
#     files/awisp/AWIspApi.h
#   Extract them from the Orange Pi Zero 3W *desktop* image (pkg libawispapi-isp-602):
#     7z x <img.7z>; loop-mount; copy /usr/lib/aarch64-linux-gnu/{libAWIspApi,libisp,libisp_ini}.so
#     + /usr/include/AWIspApi.h . See docs/design/a733-satellite-camera.md.
#
# Usage:
#   ansible-playbook -i inventory.yml provision-esszimmer-camera.yml --limit satellite-esszimmer
#   ansible-playbook -i inventory.yml provision-esszimmer-camera.yml --check          # dry-run
#   ansible-playbook -i inventory.yml provision-esszimmer-camera.yml -e camera_reboot=true
#
# Tags: pkgs, overlay, modules, awisp, tool

- name: Provision the A733 satellite CSI camera (host side)
  hosts: camera_satellites
  become: true
  gather_facts: false

  vars:
    repo_root: "{{ playbook_dir }}/../../.."
    src_dts: "{{ repo_root }}/prototypes/npu-occupancy/dts/sun60i-a733-orangepi-zero3w-cam-imx219.dts"
    src_c: "{{ repo_root }}/prototypes/npu-occupancy/isp_capture/renfield_isp_capture.c"
    awisp_src: "{{ playbook_dir }}/files/awisp"    # proprietary AW ISP libs (git-ignored)
    awisp_dir: /opt/awisp
    overlay_dir: /boot/dtb/allwinner/overlay
    overlay_name: sun60i-a733-cam-imx219           # overlays= entry (overlay_prefix=sun60i-a733)
    env_file: /boot/orangepiEnv.txt
    camera_reboot: false

  handlers:
    - name: reboot for overlay
      when: camera_reboot | bool
      ansible.builtin.reboot:
        msg: "Rebooting to load the IMX219 camera device-tree overlay"
        reboot_timeout: 300

  tasks:
    - name: Build/DT tools present
      tags: [pkgs]
      ansible.builtin.apt:
        name: [gcc, cpp, device-tree-compiler]
        state: present
        update_cache: true
        cache_valid_time: 3600

    # --- Allwinner ISP userspace (proprietary; staged on the control machine) ---
    - name: Fail early if the proprietary AW ISP libs are not staged
      tags: [awisp]
      ansible.builtin.stat:
        path: "{{ awisp_src }}/libAWIspApi.so"
      register: awlib
      delegate_to: localhost
      become: false

    - name: Abort with guidance if AW ISP libs missing
      tags: [awisp]
      ansible.builtin.fail:
        msg: >-
          Proprietary AW ISP libs not found at {{ awisp_src }}/ . Extract them from the
          OPi Zero 3W desktop image and place libAWIspApi.so/libisp.so/libisp_ini.so +
          AWIspApi.h there (git-ignored). See docs/design/a733-satellite-camera.md.
      when: not awlib.stat.exists

    - name: Ensure /opt/awisp/lib
      tags: [awisp]
      ansible.builtin.file:
        path: "{{ awisp_dir }}/lib"
        state: directory
        mode: "0755"

    - name: Install AW ISP libs
      tags: [awisp]
      ansible.builtin.copy:
        src: "{{ awisp_src }}/{{ item }}"
        dest: "{{ awisp_dir }}/lib/{{ item }}"
        mode: "0755"
      loop: [libAWIspApi.so, libisp.so, libisp_ini.so]

    - name: Install AW ISP header
      tags: [awisp]
      ansible.builtin.copy:
        src: "{{ awisp_src }}/AWIspApi.h"
        dest: "{{ awisp_dir }}/AWIspApi.h"
        mode: "0644"

    # --- Device-tree overlay (IMX219 on CAM1/CSI0) ---
    - name: Stage the camera overlay source
      tags: [overlay]
      ansible.builtin.copy:
        src: "{{ src_dts }}"
        dest: /tmp/cam-imx219.dts
        mode: "0644"

    - name: Compile the overlay (cpp | dtc)
      tags: [overlay]
      ansible.builtin.shell: >-
        cpp -nostdinc -undef -x assembler-with-cpp /tmp/cam-imx219.dts
        | dtc -@ -I dts -O dtb -o /tmp/{{ overlay_name }}.dtbo -
      changed_when: false

    - name: Install the compiled overlay (.dtbo)
      tags: [overlay]
      ansible.builtin.copy:
        src: "/tmp/{{ overlay_name }}.dtbo"
        dest: "{{ overlay_dir }}/{{ overlay_name }}.dtbo"
        remote_src: true
        mode: "0644"
      notify: reboot for overlay

    - name: Read orangepiEnv.txt
      tags: [overlay]
      ansible.builtin.slurp:
        src: "{{ env_file }}"
      register: env_raw

    - name: Add overlays= line (none present)
      tags: [overlay]
      ansible.builtin.lineinfile:
        path: "{{ env_file }}"
        line: "overlays={{ overlay_name }}"
      when: "'overlays=' not in (env_raw.content | b64decode)"
      notify: reboot for overlay

    - name: Append cam overlay to an existing overlays= line
      tags: [overlay]
      ansible.builtin.replace:
        path: "{{ env_file }}"
        regexp: '^(overlays=(?!.*\b{{ overlay_name }}\b).*)$'
        replace: '\1 {{ overlay_name }}'
      when: "'overlays=' in (env_raw.content | b64decode)"
      notify: reboot for overlay

    # --- Kernel module autoload (sunxi-vin is =m and does NOT autoload) ---
    - name: Autoload the sunxi-vin + IMX219 modules at boot
      tags: [modules]
      ansible.builtin.copy:
        dest: /etc/modules-load.d/renfield-camera.conf
        mode: "0644"
        content: |
          vin_io
          imx219
          vin_v4l2

    - name: Load the modules now (immediate, no reboot)
      tags: [modules]
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop: [vin_io, imx219, vin_v4l2]
      failed_when: false          # first run before reboot may lack the overlay; tolerated

    # --- Capture tool (built from the in-repo source against the AW header/lib) ---
    - name: Stage the capture tool source
      tags: [tool]
      ansible.builtin.copy:
        src: "{{ src_c }}"
        dest: "{{ awisp_dir }}/renfield_isp_capture.c"
        mode: "0644"

    - name: Build renfield_isp_capture
      tags: [tool]
      ansible.builtin.shell: >-
        gcc -O2 -o {{ awisp_dir }}/renfield_isp_capture {{ awisp_dir }}/renfield_isp_capture.c
        -I{{ awisp_dir }} -L{{ awisp_dir }}/lib -lAWIspApi -Wl,-rpath,{{ awisp_dir }}/lib
      args:
        creates: "{{ awisp_dir }}/renfield_isp_capture"
      # `creates` keeps it idempotent; delete the binary to force a rebuild after a .c change.

    - name: Show next steps
      tags: [always]
      ansible.builtin.debug:
        msg:
          - "Camera host setup applied. If the overlay was newly added, REBOOT (or re-run with -e camera_reboot=true)."
          - "Verify: ls /dev/video0 ; LD_LIBRARY_PATH={{ awisp_dir }}/lib {{ awisp_dir }}/renfield_isp_capture /dev/video0 1920 1080 /tmp/f.i420 8"
          - "The pod already hostPath-mounts /dev/video0 + /dev/media0 + /opt/awisp (k8s/satellite-esszimmer.yaml)."
