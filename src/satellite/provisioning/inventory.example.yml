---
# Example Ansible inventory for Renfield satellites.
# Copy this file to `inventory.yml` and edit for your setup.
# The real `inventory.yml` is gitignored so personal hostnames and IPs
# never end up in the repository.
#
# Default SSH user on Raspberry Pi OS is `pi`. Change to match your image.
#
# IMPORTANT: the inventory hostname MUST match the host_vars/<name>.yml
# filename — Ansible auto-loads host_vars by inventory_hostname. If they
# differ, per-host settings (hat_type, camera_enabled, enviro_phat_enabled,
# …) silently do NOT load and the device is provisioned with defaults
# (e.g. envirophat never installed → no environment telemetry).
#
# hat_type selects the audio driver / asound path. Supported values:
#   2mic | 4mic | xvf3800-usb | whisplay

all:
  children:
    satellites:
      hosts:
        satellite-livingroom:
          ansible_host: satellite-livingroom.local
          ansible_user: pi
          hat_type: 2mic
        satellite-kitchen:
          ansible_host: satellite-kitchen.local
          ansible_user: pi
          hat_type: 4mic
        # ReSpeaker XVF3800 USB + Enviro pHAT + Pi Camera. Per-host extras
        # (enviro_phat_enabled, camera_enabled) live in
        # host_vars/satellite-bedroom.yml — keyed by THIS hostname.
        # satellite-bedroom:
        #   ansible_host: 192.168.1.50
        #   ansible_user: pi
        #   hat_type: xvf3800-usb

    # HiFiBerry DLNA renderers — NOT satellites. Provisioned by the separate
    # provision-hifiberry.yml playbook (pins renfield.local in /etc/hosts so
    # gstreamer can fetch http TTS audio). Login user is root (HiFiBerryOS,
    # no sudo) — run with --ask-pass. Re-run after a HiFiBerryOS update.
    hifiberry:
      vars:
        ansible_user: root
        ansible_python_interpreter: /usr/bin/python3
      hosts:
        hifiberry-livingroom:
          ansible_host: hifiberry-livingroom.local

    # Camera-capable A733 satellite(s) — Orange Pi Zero 3W. The satellite itself runs as
    # a k8s POD, but the CSI camera needs HOST-side setup: provision-esszimmer-camera.yml
    # (DT overlay + module autoload + /opt/awisp ISP capture tool + libs). root login on
    # the node. NOT the bare-metal `satellites` group — those Pi Zero 2 W have no A733/ISP
    # and no camera. Requires the proprietary AW ISP libs staged at files/awisp/ (see the
    # playbook header). Re-run after a node reflash; reboot once for the overlay.
    camera_satellites:
      vars:
        ansible_user: root
      hosts:
        satellite-esszimmer:
          ansible_host: 192.168.1.82
