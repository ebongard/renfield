---
# Renfield Satellite Provisioning Playbook
#
# Provisions a Raspberry Pi Zero 2 W as a Renfield voice satellite.
# Supports ReSpeaker 2-Mic HAT (V1 + V2) and 4-Mic Array via hat_type variable.
#
# Usage:
#   ansible-playbook -i inventory.yml provision.yml --limit satellite-fitnessraum -v
#
# Tags:
#   system, boot, driver, python, app, config, models, service
#
# Run a single phase:
#   ansible-playbook -i inventory.yml provision.yml --limit satellite-fitnessraum --tags config
#
# Dry run:
#   ansible-playbook -i inventory.yml provision.yml --limit satellite-fitnessraum --check

- name: Provision Renfield Satellite
  hosts: satellites
  become: true

  handlers:
    - name: reboot after driver install
      ansible.builtin.reboot:
        # Pi Zero 2 W boots slowly (~130-150s with USB re-enumeration) — 120s
        # timed out mid-provision on the fitnessraum XVF3800 swap.
        reboot_timeout: 300
        msg: "Rebooting after audio driver installation"

    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: restart bluetooth
      ansible.builtin.systemd:
        name: bluetooth
        state: restarted

    - name: reexec systemd
      ansible.builtin.systemd:
        daemon_reexec: true

    - name: restart journald
      ansible.builtin.systemd:
        name: systemd-journald
        state: restarted

  tasks:
    # =========================================================================
    # SYSTEM — System preparation
    # =========================================================================

    - name: Install system packages
      tags: [system]
      ansible.builtin.apt:
        name: "{{ satellite_system_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Add user to hardware groups
      tags: [system]
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: audio,spi,gpio,i2c
        append: true

    - name: Create satellite directories
      tags: [system]
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"
      loop:
        - "{{ satellite_base_dir }}"
        - "{{ satellite_config_dir }}"
        - "{{ satellite_models_dir }}"
        - "{{ satellite_code_dir }}"

    # =========================================================================
    # WATCHDOG — two complementary layers:
    #   1. SoC hardware watchdog (RuntimeWatchdogSec): auto-reboots on a kernel /
    #      PID-1 hang. Raspberry Pi OS already ships this at 1 min via
    #      /usr/lib/systemd/system.conf.d/40-rpi-enable-watchdog.conf; we tighten
    #      it with a 50- drop-in (higher precedence) so it actually takes effect.
    #   2. Network watchdog (renfield-net-watchdog.timer): reboots if the Pi can't
    #      reach its default gateway for N minutes — the wedged-Wi-Fi/IP failure
    #      the HW watchdog can't catch (kernel stays healthy and keeps petting it).
    # =========================================================================

    - name: Ensure systemd manager drop-in dir exists
      tags: [watchdog, system]
      ansible.builtin.file:
        path: /etc/systemd/system.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Drop a 50- override above the OS 40-rpi-enable-watchdog.conf default.
    - name: Tighten SoC hardware watchdog (RuntimeWatchdogSec drop-in)
      tags: [watchdog, system]
      ansible.builtin.copy:
        dest: /etc/systemd/system.conf.d/50-renfield-watchdog.conf
        content: |
          # Managed by Ansible — overrides 40-rpi-enable-watchdog.conf.
          [Manager]
          RuntimeWatchdogSec={{ satellite_hw_watchdog_sec }}s
        owner: root
        group: root
        mode: "0644"
      when: satellite_hw_watchdog_sec | int > 0
      notify: reexec systemd

    # A previous revision wrote RuntimeWatchdogSec into the main system.conf
    # (inert — the OS drop-in outranks it). Remove it; idempotent on a clean
    # system (no match → no change → no reexec).
    - name: Remove inert RuntimeWatchdogSec from system.conf (now set via drop-in)
      tags: [watchdog, system]
      ansible.builtin.lineinfile:
        path: /etc/systemd/system.conf
        regexp: '^RuntimeWatchdogSec='
        state: absent
      notify: reexec systemd

    - name: Ensure satellite bin dir exists (not all HAT profiles create it)
      tags: [watchdog, system]
      ansible.builtin.file:
        path: "{{ satellite_base_dir }}/bin"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"
      when: net_watchdog_enabled | default(true)

    - name: Deploy network watchdog script
      tags: [watchdog, system]
      ansible.builtin.template:
        src: renfield-net-watchdog.sh.j2
        dest: "{{ satellite_base_dir }}/bin/renfield-net-watchdog.sh"
        owner: root
        group: root
        mode: "0755"
      when: net_watchdog_enabled | default(true)

    - name: Deploy network watchdog systemd units
      tags: [watchdog, system]
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - renfield-net-watchdog.service
        - renfield-net-watchdog.timer
      when: net_watchdog_enabled | default(true)
      notify: reload systemd

    - name: Enable + start the network watchdog timer
      tags: [watchdog, system]
      ansible.builtin.systemd:
        name: renfield-net-watchdog.timer
        enabled: "{{ net_watchdog_enabled | default(true) }}"
        state: "{{ 'started' if (net_watchdog_enabled | default(true)) else 'stopped' }}"
        daemon_reload: true

    # =========================================================================
    # BOOT — Boot configuration (config.txt)
    # =========================================================================

    - name: Enable I2S
      tags: [boot]
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        regexp: '^#?\s*dtparam=i2s'
        line: "dtparam=i2s=on"
        state: present

    - name: Enable SPI
      tags: [boot]
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        regexp: '^#?\s*dtparam=spi'
        line: "dtparam=spi=on"
        state: present

    - name: Enable I2C
      tags: [boot]
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        regexp: '^#?\s*dtparam=i2c_arm'
        line: "dtparam=i2c_arm=on"
        state: present

    - name: Remove w1-gpio overlay (GPIO4 conflict with audio HATs)
      tags: [boot]
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        regexp: '^dtoverlay=w1-gpio'
        state: absent

    # =========================================================================
    # DRIVER — Audio driver installation
    # =========================================================================

    # --- 4-Mic Array: seeed-voicecard driver ---

    - name: Clone seeed-voicecard for 4-mic HAT
      tags: [driver]
      when: hat_type == "4mic"
      ansible.builtin.git:
        repo: https://github.com/HinTak/seeed-voicecard.git
        dest: /tmp/seeed-voicecard
        version: "{{ seeed_voicecard_branch }}"
        force: true

    - name: Install seeed-voicecard driver (4-mic)
      tags: [driver]
      when: hat_type == "4mic"
      ansible.builtin.shell: |
        cd /tmp/seeed-voicecard && bash install.sh
      args:
        creates: /boot/firmware/overlays/seeed-4mic-voicecard.dtbo
      notify: reboot after driver install

    - name: Ensure 4-mic overlay in config.txt
      tags: [driver]
      when: hat_type == "4mic"
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        line: "dtoverlay=seeed-4mic-voicecard"
        state: present
      notify: reboot after driver install

    # --- 2-Mic HAT: custom GPCLK overlay ---

    - name: Copy 2-mic overlay sources to Pi
      tags: [driver]
      when: hat_type == "2mic"
      ansible.builtin.synchronize:
        src: "{{ playbook_dir }}/../hardware/"
        dest: /tmp/renfield-overlay/
        recursive: true

    - name: Install 2-mic overlay
      tags: [driver]
      when: hat_type == "2mic"
      ansible.builtin.shell: |
        cd /tmp/renfield-overlay && bash install-overlay.sh {{ overlay_variant | default('simple') }}
      args:
        creates: "/boot/firmware/overlays/seeed-2mic-gpclk-{{ overlay_variant | default('simple') }}.dtbo"
      notify: reboot after driver install

    # --- 2-Mic HAT V2: seeed-linux-dtoverlays (TLV320AIC3104) ---

    - name: Clone seeed-linux-dtoverlays for 2-mic-v2 HAT
      tags: [driver]
      when: hat_type == "2mic-v2"
      ansible.builtin.git:
        repo: "{{ seeed_dtoverlays_repo }}"
        dest: /tmp/seeed-linux-dtoverlays
        depth: 1
        force: true

    - name: Compile respeaker-2mic-v2_0 overlay
      tags: [driver]
      when: hat_type == "2mic-v2"
      ansible.builtin.shell: |
        cd /tmp/seeed-linux-dtoverlays && make overlays/rpi/respeaker-2mic-v2_0-overlay.dtbo
        cp overlays/rpi/respeaker-2mic-v2_0-overlay.dtbo /boot/firmware/overlays/respeaker-2mic-v2_0.dtbo
      args:
        creates: /boot/firmware/overlays/respeaker-2mic-v2_0.dtbo
      notify: reboot after driver install

    - name: Ensure 2-mic-v2 overlay in config.txt
      tags: [driver]
      when: hat_type == "2mic-v2"
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        line: "dtoverlay=respeaker-2mic-v2_0"
        state: present
      notify: reboot after driver install

    # A 2-Mic HAT V2 swapped onto a board that previously ran a V1/other I2S HAT
    # (e.g. this box: XVF3800-USB → V2, but the stale V1 `seeed-2mic-gpclk-simple`
    # overlay was still in config.txt loading wm8960) leaves a conflicting second
    # codec on the same I2S bus, so the TLV320 card may not enumerate. Strip the
    # stale I2S overlays so only respeaker-2mic-v2_0 binds — mirrors the
    # xvf3800-usb stale-overlay cleanup. Reboot applies it in the same cycle.
    - name: Remove stale conflicting I2S HAT overlays from config.txt (2-mic-v2)
      tags: [driver]
      when: hat_type == "2mic-v2"
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        regexp: "^dtoverlay={{ item }}"
        state: absent
      loop:
        - seeed-2mic-gpclk-simple
        - seeed-2mic-gpclk-full
        - seeed-2mic-voicecard
        - seeed-4mic-voicecard
        - wm8960-soundcard
      notify: reboot after driver install

    # --- Whisplay HAT: WM8960 codec driver ---

    - name: Clone Whisplay driver for WM8960 codec
      tags: [driver]
      when: hat_type == "whisplay"
      ansible.builtin.git:
        repo: https://github.com/PiSugar/Whisplay.git
        dest: /tmp/whisplay
        depth: 1
        force: true

    - name: Install WM8960 driver (Whisplay)
      tags: [driver]
      when: hat_type == "whisplay"
      ansible.builtin.shell: |
        cd /tmp/whisplay/Driver && bash install_wm8960_drive.sh
      args:
        creates: /boot/firmware/overlays/wm8960-soundcard.dtbo
      notify: reboot after driver install

    - name: Ensure wm8960-soundcard overlay in config.txt
      tags: [driver]
      when: hat_type == "whisplay"
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        line: "dtoverlay=wm8960-soundcard"
        state: present
      notify: reboot after driver install

    # --- XVF3800 USB: xvf_host binary + udev rule ---

    # The XVF3800 is a USB audio device — no I2S HAT overlay. If this board was
    # previously an I2S HAT (e.g. a 4-mic→XVF3800 swap), strip the stale overlay
    # so it doesn't register a phantom card at boot; a reboot applies the change.
    - name: Remove stale I2S HAT overlays from config.txt (USB mic)
      tags: [driver]
      when: hat_type == "xvf3800-usb"
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        regexp: "^dtoverlay={{ item }}"
        state: absent
      loop:
        - seeed-4mic-voicecard
        - seeed-2mic-voicecard
        - respeaker-2mic-v2_0
        - wm8960-soundcard
      notify: reboot after driver install

    - name: Create bin directory for xvf_host
      tags: [driver]
      when: hat_type == "xvf3800-usb"
      ansible.builtin.file:
        path: "{{ satellite_base_dir }}/bin"
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0755"

    - name: Deploy xvf_host binary and libraries for XVF3800 LED control
      tags: [driver]
      when: hat_type == "xvf3800-usb"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../hardware/xvf3800/"
        dest: "{{ satellite_base_dir }}/bin/"
        owner: "{{ ansible_user }}"
        mode: preserve

    - name: Deploy XVF3800 udev rule
      tags: [driver]
      when: hat_type == "xvf3800-usb"
      ansible.builtin.copy:
        content: |
          # ReSpeaker XVF3800 — allow non-root USB access, disable autosuspend
          ACTION=="add", SUBSYSTEM=="usb", ATTR{idVendor}=="2886", ATTR{idProduct}=="001a", \
              MODE="0666", TEST=="power/autosuspend", ATTR{power/autosuspend}="-1"
        dest: /etc/udev/rules.d/99-respeaker-xvf3800.rules
        mode: "0644"

    # --- XVF3800 on-chip DSP tuning (softened for biometric embeddings) ---
    # The chip boots to conference defaults (AGC-pumped + aggressive DNN-NS +
    # conference mix tap) which distort ECAPA speaker embeddings. Apply a softened
    # profile (tamed AGC, higher NS floor, ASR beam tap) and persist it to the
    # chip's OWN flash so it survives reboots. Empty `xvf3800_tuning` = leave
    # firmware defaults. See docs/design/speaker-enrollment-redesign.md Phase 4.
    - name: Apply XVF3800 DSP tuning
      tags: [driver, config, audio]
      when:
        - hat_type == "xvf3800-usb"
        - xvf3800_tuning | default({}) | length > 0
      block:
        - name: Set XVF3800 DSP params (RAM)
          ansible.builtin.command:
            argv: ["{{ xvf_host_path }}", "{{ item.key }}", "{{ item.value | string }}"]
            chdir: "{{ satellite_base_dir }}/bin"
          loop: "{{ xvf3800_tuning | dict2items }}"
          loop_control:
            label: "{{ item.key }} = {{ item.value }}"
          changed_when: true

        - name: Persist XVF3800 config to chip flash
          ansible.builtin.command:
            argv: ["{{ xvf_host_path }}", "save_configuration", "1"]
            chdir: "{{ satellite_base_dir }}/bin"
          changed_when: true

    # --- Flush handlers (reboot if driver was installed) ---

    - name: Reboot now if driver was installed
      tags: [driver]
      ansible.builtin.meta: flush_handlers

    - name: Wait for sound card after reboot
      tags: [driver]
      when: hat_type in ["2mic", "2mic-v2", "4mic", "whisplay"]
      ansible.builtin.wait_for:
        path: /proc/asound/cards
        search_regex: "seeed|wm8960"
        timeout: 30
      register: soundcard_check
      ignore_errors: true

    - name: Verify XVF3800 USB audio device
      tags: [driver]
      when: hat_type == "xvf3800-usb"
      ansible.builtin.wait_for:
        path: /proc/asound/cards
        search_regex: "Array"
        timeout: 10
      register: soundcard_check
      ignore_errors: true

    - name: Show detected sound cards
      tags: [driver]
      ansible.builtin.command: cat /proc/asound/cards
      register: asound_cards
      changed_when: false

    - name: Display sound cards
      tags: [driver]
      ansible.builtin.debug:
        var: asound_cards.stdout_lines

    # --- WM8960 ALC: hardware AGC in front of the wake-word model ---
    # openWakeWord scores on raw input amplitude (its predict() does no loudness
    # normalization), so without upstream gain-leveling, quiet/normal speech
    # under-scores and only a raised voice fires. The WM8960 codec ships with
    # ALC Function=Off; enabling its ALC dynamically lifts quiet/far-field speech
    # toward a target level. Tagged `audio` so it can be (re)applied on an
    # existing satellite in isolation — without redeploying satellite.yaml or
    # rebooting: `ansible-playbook ... --tags audio --limit <host>`.
    - name: Configure WM8960 ALC hardware AGC for wake-word reliability
      tags: [driver, config, audio]
      when: wm8960_alc_enabled | default(false)
      block:
        - name: Apply WM8960 ALC + noise-gate mixer controls
          ansible.builtin.command:
            argv:
              - amixer
              - -c
              - "{{ wm8960_alsa_card }}"
              - sset
              - "{{ item.ctl }}"
              - "{{ item.val }}"
          loop:
            - { ctl: "ALC Function",         val: "{{ wm8960_alc_function }}" }
            - { ctl: "ALC Max Gain",         val: "{{ wm8960_alc_max_gain | string }}" }
            - { ctl: "ALC Min Gain",         val: "{{ wm8960_alc_min_gain | string }}" }
            - { ctl: "ALC Target",           val: "{{ wm8960_alc_target | string }}" }
            - { ctl: "Noise Gate Threshold", val: "{{ wm8960_noise_gate_threshold | string }}" }
            - { ctl: "Noise Gate",           val: "{{ 'on' if wm8960_noise_gate_enabled else 'off' }}" }
          loop_control:
            label: "{{ item.ctl }} = {{ item.val }}"
          changed_when: true

    # --- WM8960 input capture path: mic → boost → PGA → ADC (route + unmute) ---
    # Complements the ALC task above (which tunes loudness). The Seeed 2-Mic
    # Voicecard (hat_type "2mic", card seeed2micvoicec) ships with the mic INPUT
    # path effectively muted and the pre-ALC Input Boost maxed, so the mic never
    # reaches the ADC usefully — the sat-wohnzimmer satellite had NEVER fired a
    # wakeword until this was fixed (2026-07-08). This routes the mics to the ADC
    # and sets the pre-ALC Input Boost. An SNR sweep found the maxed boost (+29 dB)
    # buries speech in ALC-amplified room noise (SNR 4.6 dB); +13 dB → SNR 17.8 dB.
    # Off by default; enable + tune per host (wm8960_input_boost 1-3; 0 re-mutes).
    # Same `audio` tag → (re)applies restart-free: `... --tags audio --limit <host>`.
    - name: Configure WM8960 input capture path (route + unmute + boost)
      tags: [driver, config, audio]
      when: wm8960_input_path_enabled | default(false)
      block:
        - name: Apply WM8960 input-routing + boost mixer controls
          ansible.builtin.command:
            argv:
              - amixer
              - -c
              - "{{ wm8960_alsa_card }}"
              - sset
              - "{{ item.ctl }}"
              - "{{ item.val }}"
          loop:
            - { ctl: "Left Boost Mixer LINPUT1",        val: "on" }
            - { ctl: "Right Boost Mixer RINPUT1",       val: "on" }
            - { ctl: "Left Input Mixer Boost",          val: "on" }
            - { ctl: "Right Input Mixer Boost",         val: "on" }
            - { ctl: "Left Input Boost Mixer LINPUT1",  val: "{{ wm8960_input_boost | string }}" }
            - { ctl: "Right Input Boost Mixer RINPUT1", val: "{{ wm8960_input_boost | string }}" }
          loop_control:
            label: "{{ item.ctl }} = {{ item.val }}"
          changed_when: true

    # Persist the WM8960 mixer state ONCE, after whichever of the two tuning
    # tasks above ran — so a host with BOTH ALC + input-path enabled doesn't
    # store twice. Restored on boot by alsa-restore.service.
    # --- TLV320AIC3104 (hat_type "2mic-v2") ADC high-pass filter ---
    # The AIC3104 ships with 'ADC HPF Cut-off' = Disabled, which leaves a large
    # DC offset on the capture path. Measured on sat-kinderbad 2026-09-04:
    #
    #   DC component  2320.9  (-23.0 dBFS)
    #   real ambient    56.4  (-55.3 dBFS)
    #
    # i.e. the offset sat 32 dB ABOVE the room. A spectrum of the capture put
    # 100 % of the energy below 100 Hz, dominated by 0 Hz.
    #
    # Two consequences, and the second is the expensive one:
    #   1. `audio_rms` in the heartbeat is computed without removing the mean,
    #      so the satellite reported ~1812 where the true ambient was ~5. Any
    #      comparison of mic levels across satellites was meaningless.
    #   2. The wakeword model sees a constant offset it was never trained on and
    #      fires at high confidence on it — sat-kinderbad produced false wakes at
    #      0.84-0.98 (4 of 5 sessions ended in an empty transcription), while the
    #      threshold sits at 0.5. Raising the threshold cannot fix that, and the
    #      threshold is fleet-wide anyway.
    #
    # 0.0045xFs is the gentlest of the three cut-offs (~72 Hz at 16 kHz) — it
    # removes the offset and leaves the speech band untouched. After enabling:
    # DC 0.0, ambient -76 dBFS.
    #
    # Off by default; enable per host. Same `audio` tag → applies restart-free:
    #   ansible-playbook … --tags audio --limit <host>
    - name: Configure AIC3104 ADC high-pass filter (removes capture DC offset)
      tags: [driver, config, audio]
      when: aic3104_adc_hpf_enabled | default(false)
      ansible.builtin.command:
        argv:
          - amixer
          - -c
          - "{{ aic3104_alsa_card | default('0') }}"
          - sset
          - "ADC HPF Cut-off"
          # Both channels: a single value only sets Item0 and leaves the right
          # channel Disabled (verified on sat-kinderbad).
          - "{{ aic3104_adc_hpf }},{{ aic3104_adc_hpf }}"
      changed_when: true

    # Persist the mixer state ONCE, after whichever tuning task above ran — so a
    # host with several enabled doesn't store repeatedly. Restored on boot by
    # alsa-restore.service.
    - name: Persist ALSA mixer state
      tags: [driver, config, audio]
      when: >-
        (wm8960_alc_enabled | default(false))
        or (wm8960_input_path_enabled | default(false))
        or (aic3104_adc_hpf_enabled | default(false))
      ansible.builtin.command:
        argv: [alsactl, store]
      changed_when: true

    # =========================================================================
    # PYTHON — Python virtual environment
    # =========================================================================

    - name: Create Python venv
      tags: [python]
      become_user: "{{ ansible_user }}"
      ansible.builtin.command:
        cmd: python3 -m venv {{ satellite_venv }}
        creates: "{{ satellite_venv }}/bin/python"

    - name: Upgrade pip
      tags: [python]
      become_user: "{{ ansible_user }}"
      ansible.builtin.pip:
        name: pip
        state: latest
        virtualenv: "{{ satellite_venv }}"

    - name: Install Python packages
      tags: [python]
      become_user: "{{ ansible_user }}"
      ansible.builtin.pip:
        name: "{{ satellite_python_packages }}"
        virtualenv: "{{ satellite_venv }}"

    # Also tagged `app`: cryptography is a HARD runtime dep of ble/rpa.py (IRK
    # RPA resolution) but rpa.py silently no-ops without it — resolve_rpa()
    # returns False for every address, so phone presence dies invisibly. It was
    # added to satellite_python_packages after sats were first provisioned, and
    # the safety code-only deploy (`--tags app`) skips `[python]`, so it never
    # landed and IRK resolution was dead on every bare-metal satellite (2026-06).
    # Same drift the envirophat task below guards against. Restart-free (no
    # handler notify); the running process picks it up on its next restart.
    - name: Ensure cryptography in venv (IRK RPA resolution — also on app deploys)
      tags: [python, app]
      become_user: "{{ ansible_user }}"
      ansible.builtin.pip:
        name: cryptography
        virtualenv: "{{ satellite_venv }}"

    # opuslib is only used when audio.codec: opus (C1 binary transport). It
    # imports fine without libopus0 at import time but no-ops the codec, so a
    # missing lib degrades to pcm (graceful). Tagged `app` for the same reason
    # as cryptography above: a code-only `--tags app` deploy must not silently
    # drop it, or a satellite that later enables opus stays on pcm forever. Needs
    # the libopus0 system package (in satellite_system_packages, `[system]` tag).
    - name: Ensure opuslib in venv (C1 Opus transport — also on app deploys)
      tags: [python, app]
      become_user: "{{ ansible_user }}"
      ansible.builtin.pip:
        name: opuslib
        virtualenv: "{{ satellite_venv }}"

    - name: Install openwakeword (--no-deps for Python 3.13+ compat)
      tags: [python]
      become_user: "{{ ansible_user }}"
      ansible.builtin.pip:
        name: "{{ openwakeword_package }}"
        virtualenv: "{{ satellite_venv }}"
        extra_args: "--no-deps"

    # Also tagged `app`: this is a host-conditional venv dependency, and the
    # safety-recommended code-only deploy (`--tags app`, avoids driver/service
    # restart brick-risk on Pi Zero 2 W) would otherwise skip it forever — a
    # device enabling enviro_phat would silently never get the lib (the
    # sat-benszimmer drift, 2026-05). This pip task notifies no restart/reboot
    # handler, so running it on `app` deploys stays restart-free.
    - name: Install envirophat package
      tags: [python, app]
      when: enviro_phat_enabled | default(false)
      become_user: "{{ ansible_user }}"
      ansible.builtin.pip:
        name: envirophat
        virtualenv: "{{ satellite_venv }}"

    # envirophat hard-imports the C extension `smbus`, provided ONLY by the
    # apt package python3-smbus (no working pip equivalent on Raspbian). The
    # venv is created WITHOUT --system-site-packages, so apt alone is not
    # enough — the .so must be linked into the venv. Recreating the venv with
    # system-site-packages would change dependency resolution for every
    # satellite, so we link just this one ABI-matching module (system python
    # and venv python are the same 3.11.x on Pi OS). Without these two tasks
    # the envirophat install above imports-fails and enviro telemetry is
    # silently dead (the sat-benszimmer drift, 2026-05).
    - name: Install python3-smbus (envirophat C-extension dependency)
      tags: [python, app]
      when: enviro_phat_enabled | default(false)
      ansible.builtin.apt:
        name: python3-smbus
        state: present

    - name: Discover system smbus extension module
      tags: [python, app]
      when: enviro_phat_enabled | default(false)
      ansible.builtin.shell: >-
        set -o pipefail;
        dpkg -L python3-smbus | grep -E '/smbus\.cpython-.*\.so$' | head -1
      args:
        executable: /bin/bash
      register: smbus_so
      changed_when: false

    - name: Find venv site-packages directory
      tags: [python, app]
      when: enviro_phat_enabled | default(false)
      ansible.builtin.find:
        paths: "{{ satellite_venv }}/lib"
        patterns: "site-packages"
        file_type: directory
        recurse: true
      register: venv_site_packages

    - name: Link system smbus module into the venv
      tags: [python, app]
      when:
        - enviro_phat_enabled | default(false)
        - smbus_so.stdout | length > 0
        - venv_site_packages.files | length > 0
      become_user: "{{ ansible_user }}"
      ansible.builtin.file:
        src: "{{ smbus_so.stdout }}"
        dest: "{{ venv_site_packages.files[0].path }}/{{ smbus_so.stdout | basename }}"
        state: link
        force: true

    # =========================================================================
    # APP — Deploy application code
    # =========================================================================

    - name: Deploy satellite code via rsync
      tags: [app]
      ansible.builtin.synchronize:
        src: "{{ playbook_dir }}/../renfield_satellite/"
        dest: "{{ satellite_code_dir }}/"
        recursive: true
        delete: true
        rsync_opts:
          - "--exclude=__pycache__"
          - "--exclude=*.pyc"
          - "--exclude=.pytest_cache"

    - name: Set code ownership
      tags: [app]
      ansible.builtin.file:
        path: "{{ satellite_code_dir }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        recurse: true

    # =========================================================================
    # CONFIG — Configuration files
    # =========================================================================

    - name: Deploy satellite.yaml
      tags: [config]
      ansible.builtin.template:
        src: satellite.yaml.j2
        dest: "{{ satellite_config_dir }}/satellite.yaml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"

    - name: Deploy ALSA config (system-wide)
      tags: [config]
      ansible.builtin.template:
        src: "asoundrc-{{ hat_type }}.j2"
        dest: /etc/asound.conf
        owner: root
        group: root
        mode: "0644"

    # WiFi power save causes periodic ~30-50s WebSocket disconnects on the
    # Pi Zero 2 W brcmfmac: power-save latency makes the satellite miss the
    # backend's keepalive ping, so the server drops the connection → endless
    # reconnect loop (measured 98 reconnects / 30 min on Arbeitszimmer until
    # disabled — looked like "reboots" via the backend's connection-uptime but
    # the board never restarted). The previous modprobe options did NOT disable
    # power save (`roamoff` = roaming; `8192cu` = a different Realtek chip) and
    # /etc/rc.local is not reliably run on Bookworm. NetworkManager also
    # re-enables power save on every reconnect, so a dispatcher that runs on
    # each wlan0 `up` is the only robust fix.
    - name: Install NetworkManager dispatcher to disable WiFi power save
      tags: [config, wifi]
      ansible.builtin.copy:
        dest: /etc/NetworkManager/dispatcher.d/50-renfield-wifi-powersave
        mode: "0755"
        content: |
          #!/bin/sh
          # Managed by Ansible — disable WiFi power save whenever wlan0 comes up
          # (prevents periodic WebSocket disconnects on Pi Zero 2 W brcmfmac).
          [ "$1" = "wlan0" ] && [ "$2" = "up" ] && /usr/sbin/iw dev wlan0 set power_save off
          exit 0

    - name: Disable WiFi power save on the active NM connection (persists in profile)
      tags: [config, wifi]
      ansible.builtin.shell: |
        set -o pipefail
        con=$(nmcli -t -f DEVICE,NAME connection show --active | sed -n 's/^wlan0://p' | head -1)
        if [ -n "$con" ]; then
          nmcli connection modify "$con" 802-11-wireless.powersave 2
        fi
      args:
        executable: /bin/bash
      changed_when: true
      failed_when: false

    - name: Disable WiFi power save immediately (no reboot/reconnect needed)
      tags: [config, wifi]
      ansible.builtin.command: iw dev wlan0 set power_save off
      changed_when: true
      failed_when: false

    # Persistent journald: the satellites have no RTC and shipped with a volatile
    # journal, so the cause of any crash/reboot was wiped on restart and was
    # undiagnosable. Persist the journal (size-capped to bound SD-card wear) so a
    # post-mortem is possible. Mirrors the fix applied to the Esszimmer satellite.
    - name: Ensure journald.conf.d drop-in directory exists
      tags: [config, journald]
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: "0755"

    - name: Enable persistent journald
      tags: [config, journald]
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/10-renfield-persistent.conf
        mode: "0644"
        content: |
          # Managed by Ansible — persist the journal across reboots for diagnosis.
          [Journal]
          Storage=persistent
          SystemMaxUse=200M
          SystemMaxFileSize=50M
      notify: restart journald

    - name: Ensure persistent journal directory exists
      tags: [config, journald]
      ansible.builtin.file:
        path: /var/log/journal
        state: directory
        mode: "2755"
      notify: restart journald

    # =========================================================================
    # MODELS — Wake word and VAD models
    # =========================================================================

    - name: Download openWakeWord base models
      tags: [models]
      become_user: "{{ ansible_user }}"
      ansible.builtin.get_url:
        url: "{{ oww_base_url }}/{{ item }}"
        dest: "{{ satellite_models_dir }}/{{ item }}"
        mode: "0644"
      loop: "{{ oww_models }}"

    - name: Download Alexa wake word model
      tags: [models]
      become_user: "{{ ansible_user }}"
      ansible.builtin.get_url:
        url: "{{ alexa_model_url }}"
        dest: "{{ satellite_models_dir }}/alexa_v0.1.onnx"
        mode: "0644"

    - name: Download Silero VAD model
      tags: [models]
      become_user: "{{ ansible_user }}"
      ansible.builtin.get_url:
        url: "{{ silero_vad_url }}"
        dest: "{{ satellite_models_dir }}/silero_vad.onnx"
        mode: "0644"

    - name: Find openwakeword models directory in venv
      tags: [models]
      ansible.builtin.find:
        paths: "{{ satellite_venv }}/lib"
        patterns: "openwakeword"
        file_type: directory
        recurse: true
      register: oww_dirs

    - name: Create openwakeword models directory in venv
      tags: [models]
      when: oww_dirs.files | length > 0
      ansible.builtin.file:
        path: "{{ oww_dirs.files[0].path }}/resources/models"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Copy models to openwakeword package directory
      tags: [models]
      when: oww_dirs.files | length > 0
      ansible.builtin.copy:
        src: "{{ satellite_models_dir }}/{{ item }}"
        dest: "{{ oww_dirs.files[0].path }}/resources/models/{{ item }}"
        remote_src: true
        owner: "{{ ansible_user }}"
        mode: "0644"
      loop:
        - melspectrogram.onnx
        - embedding_model.onnx
        - alexa_v0.1.onnx

    # =========================================================================
    # BLUETOOTH — ensure the adapter is unblocked + up for presence scanning
    # =========================================================================
    # The Pi can boot with BT rfkill SOFT-BLOCKED (hci0 DOWN), which silently
    # kills BLE + Classic-BT presence scanning. A boot oneshot unblocks + ups it.

    - name: Deploy Bluetooth-enable oneshot unit
      tags: [bluetooth, config]
      ansible.builtin.template:
        src: renfield-bt.service.j2
        dest: /etc/systemd/system/renfield-bt.service
        mode: "0644"
      notify: reload systemd

    - name: Flush handlers (reload systemd for BT unit)
      tags: [bluetooth, config]
      ansible.builtin.meta: flush_handlers

    - name: Enable + start Bluetooth-enable oneshot (unblocks BT now + on boot)
      tags: [bluetooth, config]
      ansible.builtin.systemd:
        name: renfield-bt
        enabled: true
        state: started

    # Enable BlueZ experimental features — required for the AdvertisementMonitor
    # API (continuous, kernel-offloaded, threshold-based per-device RSSI used by
    # the continuous BLE presence scanner). Without this, BlueZ rejects the
    # passive/monitor APIs. Survives re-image; restarts bluetoothd on change.
    - name: Enable BlueZ Experimental (AdvertisementMonitor API)
      tags: [bluetooth, config]
      ansible.builtin.ini_file:
        path: /etc/bluetooth/main.conf
        section: General
        option: Experimental
        value: "true"
        no_extra_spaces: true
        mode: "0644"
      notify: restart bluetooth

    # =========================================================================
    # SERVICE — Systemd service
    # =========================================================================

    - name: Deploy systemd service file
      tags: [service]
      ansible.builtin.template:
        src: renfield-satellite.service.j2
        dest: /etc/systemd/system/renfield-satellite.service
        mode: "0644"
      notify: reload systemd

    - name: Flush handlers (reload systemd)
      tags: [service]
      ansible.builtin.meta: flush_handlers

    - name: Enable renfield-satellite service
      tags: [service]
      ansible.builtin.systemd:
        name: renfield-satellite
        enabled: true

    - name: Start renfield-satellite service
      tags: [service]
      ansible.builtin.systemd:
        name: renfield-satellite
        state: started

    # =========================================================================
    # VERIFY — Post-provisioning checks
    # =========================================================================

    - name: Check service status
      tags: [service]
      ansible.builtin.command: systemctl status renfield-satellite --no-pager
      register: service_status
      changed_when: false
      ignore_errors: true

    - name: Display service status
      tags: [service]
      ansible.builtin.debug:
        var: service_status.stdout_lines

    - name: Show provisioning summary
      tags: [always]
      ansible.builtin.debug:
        msg: |
          Satellite provisioned successfully!
          - Host: {{ inventory_hostname }}
          - HAT: {{ hat_type }}
          - ID: {{ satellite_id }}
          - Room: {{ satellite_room }}
          - LED type: {{ led_type | default('apa102') }}
          - Display: {{ display_enabled | default(false) }}
          - Server: {{ server_url }}
