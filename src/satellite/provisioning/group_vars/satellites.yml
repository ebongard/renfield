---
# Common defaults for all Renfield satellites

# Connection
ansible_python_interpreter: /usr/bin/python3

# Application paths
satellite_base_dir: /opt/renfield-satellite
satellite_venv: "{{ satellite_base_dir }}/venv"
satellite_config_dir: "{{ satellite_base_dir }}/config"
satellite_models_dir: "{{ satellite_base_dir }}/models"
satellite_code_dir: "{{ satellite_base_dir }}/renfield_satellite"

# Source paths (relative to playbook)
source_code_dir: "../renfield_satellite"
source_hardware_dir: "../hardware"

# Server connection
server_url: "wss://renfield.local/ws/satellite"
server_auto_discover: true
server_auth_enabled: false
server_verify_tls: false
# Per-satellite enrollment PSK (security review H1). MUST be set per host in the
# gitignored host_vars/satellite-<name>.yml (never here — group_vars is in git).
# Mint it with `bin/enroll_satellite.py <satellite_id>` (or the admin UI), paste
# the printed token here, re-provision with --tags config. Empty = not enrolled
# (the backend treats an absent token as legacy until enrollment is enforced).
satellite_enrollment_token: ""

# OTA release signing (security review H6). PUBLIC keys are safe in git — add the
# hex public key(s) printed by `bin/sign_satellite_release.py --gen-key`. Multiple
# entries = key rotation (the satellite accepts any). require_signature stays
# false until the release-signing pipeline is live, then flip to fail-closed.
satellite_release_pubkeys: []
satellite_ota_require_signature: false
# Connection robustness (Pi Zero 2 W 2.4GHz WiFi is marginal — detect dead links
# fast and self-heal instead of wedging). See docs/SATELLITE_CONNECTIVITY.md.
server_ping_interval: 15          # WS keepalive cadence (s)
server_ping_timeout: 8            # drop the link if no pong within (s)
server_register_timeout: 15       # cap the post-connect register handshake (s)
server_max_disconnected_seconds: 300  # exit→systemd restart if unreconnectable this long (0=off)

# Hardware watchdog: systemd pets /dev/watchdog every cycle; if PID 1 / the kernel
# hangs, the SoC watchdog hard-resets the board. Keep <= the SoC max (BCM2835 ~15s,
# sunxi ~16s) or the timer won't arm. 0 disables. Set via a 50- drop-in that
# overrides the Raspberry Pi OS default (40-rpi-enable-watchdog.conf = 1 min).
satellite_hw_watchdog_sec: 14

# Network watchdog: reboots the Pi if its default gateway is unreachable for
# net_watchdog_fail_threshold consecutive ~1-min checks — recovers a wedged
# Wi-Fi/IP stack that the HW watchdog can't (kernel stays healthy). Empty target
# = auto-derive the gateway. A 10-min post-boot grace prevents reboot loops.
net_watchdog_enabled: true
net_watchdog_target: ""
net_watchdog_fail_threshold: 5
net_watchdog_max_reboots: 3        # stop rebooting after this many — a gateway down
                                   # for hours won't be fixed by it; a good ping refills
# Tier-1 reachability anchor (host:port). ICMP-ping the gateway is a FALSE signal
# on nets whose gateway filters ICMP (it forwards traffic but never answers pings
# → the Pi reboot-loops a healthy board, observed 2026-07-13). The network also
# counts as alive if a TCP handshake to this anchor completes. Point it at the
# ingress LB (up independent of the backend pod). Empty = ICMP-only (legacy).
net_watchdog_anchor: "192.168.1.230:443"

# Tier-2 backend-link watchdog (same timer/script): when the gateway IS reachable
# but the satellite process is running yet holds NO connection to the backend
# ingress for backend_watchdog_fail_threshold consecutive ~1-min checks, restart
# the satellite service (NOT a reboot — a down backend isn't the Pi's fault).
# Recovers the "service up but wedged, stayed dark for hours until power-cycled"
# failure that neither the HW nor the gateway watchdog catches. Threshold is kept
# above server.max_disconnected_seconds so the app's own reconnect tries first.
backend_watchdog_service: "renfield-satellite.service"
backend_watchdog_port: 443                # wss ingress port the satellite connects to
backend_watchdog_fail_threshold: 10       # ~10 min wedged → restart the service
backend_watchdog_max_restarts: 3          # stop after this many — a restored link refills

# Wake word
wakeword_model: "hey_renfield"
wakeword_threshold: 0.5

# VAD
vad_backend: "silero"
vad_silence_duration_ms: 1200
vad_max_recording_seconds: 20
vad_silero_threshold: 0.5

# WM8960 codec ALC (Automatic Level Control) — hardware AGC applied INSIDE the
# codec, before audio ever reaches the wake-word model. openWakeWord's predict()
# does NO loudness normalization (raw int16 → melspectrogram), so its score is a
# direct function of input amplitude: quiet/normal-volume speech under-scores and
# only a raised voice crosses threshold. ALC dynamically lifts quiet/far-field
# speech toward a target level — the same gain-staging wyoming-satellite does in
# software (WebRTC AGC) and HA Voice PE does with gain_factor. The codec ships
# with ALC Function=Off, which is the root cause of "must raise voice".
# WM8960-based hats only (whisplay, 2mic, 2mic-v2). Disabled by default; enable
# per-host. Validated on Arbeitszimmer/whisplay 2026-06-24 (normal-voice scores
# 59-77% with ALC vs 11-45% without). Persisted via `alsactl store` →
# /var/lib/alsa/asound.state, restored on boot by alsa-restore.service.
wm8960_alc_enabled: false
wm8960_alsa_card: "wm8960soundcard"   # `amixer -c` target (whisplay; 2mic = seeed2micvoicec)
wm8960_alc_function: "Stereo"          # Off | Right | Left | Stereo
wm8960_alc_target: 6                   # 0-15, higher = louder normalized target level
wm8960_alc_max_gain: 7                 # 0-7, caps PGA so ALC can't run away into noise
wm8960_alc_min_gain: 0                 # 0-7
wm8960_noise_gate_enabled: true        # stops ALC pumping/pulling up idle hiss between utterances
wm8960_noise_gate_threshold: 5         # 0-31 (1.5dB steps), a few steps above the room's idle floor
# Seeed 2-Mic (hat_type "2mic") ships the mic INPUT path muted / boost maxed, so
# the mic never reaches the ADC. Enable per-host to route + unmute + set the
# pre-ALC Input Boost. Off by default (no effect on Whisplay, which is fine).
wm8960_input_path_enabled: false       # enable the mic→ADC input-routing task
# pre-ALC Input Boost Mixer level. VALID RANGE 1-3 (+13/+21/+29 dB). Do NOT use
# 0 — it disconnects the boost mixer and re-MUTES the mic (the exact bug this
# task fixes). 1 (+13 dB) is tuned for SNR (higher buries speech in ALC noise).
wm8960_input_boost: 1

# LED
led_brightness: 20
led_night_brightness: 5
led_type: "apa102"
# led_power_pin is referenced (guarded by `is not none`) in the non-gpio_rgb LED
# branch that apa102/xvf3800 hit, so it must be DEFINED — null omits the line.
# A gpio_rgb host with a power-enable pin sets it in host_vars.
# (led_gpio_red/green/blue are deliberately NOT defaulted: they're emitted only
# for led_type "gpio_rgb", so a gpio_rgb host that forgets them should fail LOUD
# at render rather than silently drive reserved BCM GPIO0.)
led_power_pin: null

# Display
display_enabled: false

# Camera (visual queries + announce occupancy checks).
#   camera_enabled  — per-host on/off (rendered into the app config).
#   camera_backend  — HOW the frame is captured, by board:
#     "rpicam"     Raspberry Pi + Pi Camera (IMX219 etc.) via the OS libcamera/rpicam
#                  stack — works out of the box, NO host provisioning needed (the app
#                  uses rpicam-still). This is the default for the Pi satellites.
#     "sunxi_isp"  Orange Pi A733 (Esszimmer) + MIPI-CSI IMX219 — needs host-side setup
#                  (DT overlay + sunxi-vin modules + the Allwinner ISP userspace +
#                  renfield_isp_capture). Set in that host's host_vars.
# provision-camera.yml is config-driven off these two — it applies the sunxi_isp host
# setup only where camera_backend == "sunxi_isp", and is a no-op for rpicam hosts.
camera_enabled: false
camera_backend: rpicam

# Button
button_gpio_pin: 17

# Language
satellite_language: "de"

# System packages needed on all satellites
satellite_system_packages:
  - python3-pip
  - python3-venv
  - python3-dev
  - portaudio19-dev
  - libasound2-dev
  - libasound2-plugins
  - libopenblas0
  - libopus0            # runtime lib for opuslib (C1 binary Opus transport)
  - libmpv-dev
  - mpv
  - libsamplerate0
  - swig
  - liblgpio-dev
  - git
  - device-tree-compiler

# Python packages (installed in venv)
satellite_python_packages:
  # setuptools<81 ships pkg_resources, which webrtcvad imports. Python 3.13
  # venvs don't bundle setuptools and the latest (>=81) dropped pkg_resources,
  # so without this a fresh venv crashes on `import webrtcvad`.
  - "setuptools<81"
  - onnxruntime
  - pyaudio
  - numpy
  - websockets
  - python-mpv
  - spidev
  - lgpio
  - gpiozero
  - pyyaml
  - zeroconf
  - webrtcvad
  - psutil
  - scikit-learn
  - noisereduce
  - aiohttp
  - requests
  - bleak
  - cryptography   # IRK-based RPA resolution (ble/rpa.py) — resolve rotating phone addresses
  - Pillow
  # NB: opuslib is NOT listed here — it has a dedicated `[python, app]` task in
  # provision.yml (so a code-only `--tags app` deploy installs it, like
  # cryptography). libopus0 (its C lib) is in satellite_system_packages above.

# XVF3800 LED control
xvf_host_path: "/opt/renfield-satellite/bin/xvf_host"

# XVF3800 on-chip DSP tuning (map of xvf_host CMD -> value, applied + persisted to
# the chip flash during provisioning; see provision.yml + docs/design/speaker-
# enrollment-redesign.md Phase 4). Empty = leave firmware/conference defaults.
# Override per-satellite in host_vars. Softened profile for biometric embeddings
# reduces AGC pumping + DNN-NS timbre distortion that hurt ECAPA speaker matching.
# NOTE: on/off params must be 1/0, NOT YAML true/false (the task string-casts the
# value and xvf_host rejects "True"/"False"). Provisioning is infrequent, so
# re-writing the chip flash on each run is a non-issue for flash endurance.
xvf3800_tuning: {}

# Enviro pHAT
enviro_phat_enabled: false

# BLE Presence Detection
ble_enabled: true
# Fleet-wide fast presence: continuous scanner + 3s report cadence, matching the
# Esszimmer k8s pod. Measured 2026-07-09: Wohnzimmer (30s periodic) reported 10x
# slower than Esszimmer (3s), which biased the backend room-arbitration toward
# whichever satellite reported more often (a 3s sat gets 10 filter updates per 1
# from a 30s sat → it holds/steals the room regardless of true signal). Equalising
# the cadence is the real fix; continuous makes a 3s poll near-free (in-memory
# snapshot of an always-running BleakScanner, no extra radio bursts).
ble_scan_interval: 3
ble_scan_duration: 5
ble_rssi_threshold: -80
# Continuous BLE scanning (one long-running BleakScanner + smoothed EWMA RSSI)
# instead of periodic discover() bursts. On fleet-wide so scan_interval=3 is a
# cheap in-memory poll rather than a 3s radio burst (proven on the Pi Zero 2 W
# BT 4.2 radio by the Wohnzimmer node, which has run continuous steadily).
ble_continuous: true
ble_smoothing_alpha: 0.4
ble_freshness_seconds: 20.0

# openwakeword installed separately with --no-deps for Python 3.13+ compat
openwakeword_package: "openwakeword"

# 2-Mic V2 driver repo (TLV320AIC3104 codec)
seeed_dtoverlays_repo: "https://github.com/Seeed-Studio/seeed-linux-dtoverlays.git"

# Model URLs
oww_base_url: "https://github.com/dscripka/openWakeWord/releases/download/v0.5.1"
oww_models:
  - melspectrogram.onnx
  - embedding_model.onnx
silero_vad_url: "https://github.com/snakers4/silero-vad/raw/master/src/silero_vad/data/silero_vad.onnx"
alexa_model_url: "{{ oww_base_url }}/alexa_v0.1.onnx"
