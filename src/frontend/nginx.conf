# Baseline Content-Security-Policy for the Renfield PWA.
#
# Derived from THIS app's actual needs (not a generic template) — every
# directive below is tied to a real, grepped usage:
#
#   default-src 'self'
#       Fallback for any directive not listed. Same-origin only.
#
#   script-src 'self' 'wasm-unsafe-eval' blob: 'sha256-...'
#       'self'            — the hashed Vite bundles + the external
#                           /registerSW.js the PWA plugin injects.
#       'wasm-unsafe-eval'— onnxruntime-web compiles the wake-word .onnx/.ort
#                           models via WebAssembly (src/hooks/useWakeWord.ts:
#                           `import('onnxruntime-web')`, wasmPaths '/ort/').
#                           WASM compilation is CSP-gated; this token permits it
#                           WITHOUT permitting JS eval(). Omit it → wake word
#                           silently dies. (numThreads=1 + proxy=false, so NO
#                           onnxruntime web-worker is spawned.)
#       blob:             — the wake-word lib (openwakeword-wasm-browser) loads
#                           its AudioWorklet processor from a blob: URL
#                           (`new Blob([src]) → createObjectURL → audioWorklet
#                           .addModule(blobURL)`). AudioWorklet modules are
#                           governed by script-src (NOT worker-src), so without
#                           blob: here the worklet load is blocked with
#                           `AbortError: Unable to load a worklet's module` and
#                           wake word is unavailable. blob: URLs are same-origin-
#                           created and there is no HTML-injection sink (Lane A
#                           artifacts are React-escaped), so this opens no
#                           practical hole — the standard cost of a blob-worklet
#                           PWA. (Regression fix: enforcing CSP without blob:
#                           broke wake word; verified the onnxruntime WASM path
#                           but not the separate AudioWorklet path.)
#       'sha256-...'      — the ONE static inline <script> in index.html (the
#                           FOUC theme-flash guard). Hashed instead of
#                           'unsafe-inline' so no inline-script injection
#                           surface is opened. Verified against the MINIFIED
#                           dist/index.html (Vite's html-minify did NOT alter
#                           the bytes) before enforcing — see note below.
#
#   style-src 'self' 'unsafe-inline'
#       'self'            — the hashed Tailwind v4 stylesheet + bundled
#                           @fontsource CSS.
#       'unsafe-inline'   — REQUIRED, not avoidable by hashing:
#                           (a) 14 components use React `style={{...}}` for
#                               dynamic widths/heights/CSS-vars
#                               (e.g. PaperlessAuditPage progress bars,
#                               GraphView height, BestaetigtToast --toast-duration);
#                           (b) recharts / react-force-graph / three.js inject
#                               runtime <style> elements with computed values.
#                           These are dynamic → no stable hash exists. CSP has no
#                           way to allow attribute styles via hash in practice,
#                           so 'unsafe-inline' on style-src stays. Low risk:
#                           style injection ≠ script execution.
#
#   img-src 'self' data: blob:
#       'self'  — /logo-icon.svg etc., same-origin Paperless thumbnails.
#       data:   — inline data:image/svg+xml noise backgrounds on Login/Register.
#       blob:   — object-URL chat images / generated previews.
#
#   font-src 'self'
#       @fontsource-variable/{dm-sans,cormorant} are BUNDLED (imported in
#       main.tsx) → served same-origin as .woff2. No CDN. (data: kept off here;
#       @fontsource emits url(...woff2) references, not data: URIs.)
#
#   connect-src 'self'
#       Chat / device / wakeword WebSockets + /api fetches are ALL same-origin
#       in prod (getWebSocketUrl/getApiBaseUrl derive from window.location →
#       wss://<host>/ws). 'self' covers same-origin wss:. SearXNG/Ollama are
#       server-side, never reached from the browser. NOTE: if a deploy ever sets
#       VITE_WS_URL/VITE_API_URL to a CROSS-origin host, add that origin here.
#
#   media-src 'self' blob: data:
#       TTS audio playback (new Audio / AudioContext) plays same-origin or
#       object-URL/data: blobs (src/pages/ChatPage/hooks/useAudioRecording.ts).
#
#   worker-src 'self' blob:
#       The vite-plugin-pwa service worker (sw.js, same-origin). blob: kept for
#       any future blob-URL worker (Workbox can register workers via blob).
#
#   manifest-src 'self'   — the PWA web manifest.
#   frame-src 'self'      — no iframes today; reserved for the Lane B chat-
#                           artifact sandbox (srcdoc frames) — harmless now.
#   frame-ancestors 'none'— clickjacking defence; supersedes X-Frame-Options
#                           (kept for old-browser belt-and-suspenders).
#   base-uri 'self'       — block <base> tag hijack of relative URLs.
#   object-src 'none'     — no <object>/<embed>/<applet> plugins, ever.
#   form-action 'self'    — forms may only POST same-origin.
#
# ---------------------------------------------------------------------------
# ENFORCING (v2, frontend v2.15.16). The header name is `Content-Security-Policy`
# — violations are BLOCKED, not just reported. v1 (frontend v2.15.15) shipped the
# Report-Only variant and was browser-verified clean (zero securitypolicyviolation
# events across load + /chat + /wissen + /settings + a live WS open) before this
# flip. The two trap directives were both confirmed against the real build:
#   * the inline-script HASH — hashing the MINIFIED served dist/index.html's
#     inline <script> reproduced 'sha256-...' exactly (Vite's html-minify did
#     not alter the bytes). If a future build changes that inline script, the
#     theme guard will be BLOCKED — recompute the hash from the built
#     dist/index.html, or fall back to 'unsafe-inline' on script-src.
#   * 'wasm-unsafe-eval' — confirmed: the onnxruntime wake-word WASM compiled
#     and ran. Removing it would now BLOCK wakeword, not just report it.
# To revert to observe-mode, rename the header back to
# `Content-Security-Policy-Report-Only` in every location below.
#
# nginx `add_header` does NOT inherit once a location declares its own — so the
# CSP (like the other security headers) is re-declared in EVERY location that
# sets headers. The $csp variable below is the single source of truth to avoid
# per-location drift. (Documented trap: reference_pwa_sw_nocache_nginx.)
# ---------------------------------------------------------------------------

# Single source of truth for the policy string (avoids per-location drift).
map $host $csp {
    default "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob: 'sha256-punQmGiNS8da81PCRuSsjEAS5CzAnZcWK/ykEF4Wg4A='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob: data:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Baseline CSP — ENFORCING (v1 shipped Report-Only, verified clean, then flipped).
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=15768000" always;

    # Service worker + its registration script have STABLE names (sw.js,
    # registerSW.js), so the immutable rule below would HTTP-cache them for a
    # year — the browser would then never re-fetch the SW, never detect a new
    # deploy, and keep serving the stale precached app shell across reloads
    # (observed: provenance/follow-up/palette features invisible until a manual
    # SW clear). Must come BEFORE the generic .js block (first matching regex
    # location wins). no-cache = revalidate every load so updates propagate.
    # (workbox-*.js is content-hashed, so it stays in the immutable block.)
    # NOTE: nginx `add_header` does NOT inherit from the server block once a
    # location declares its own — so every location with a Cache-Control header
    # must re-declare the security headers AND the CSP, or it silently drops them.
    location ~* ^/(sw\.js|registerSW\.js)$ {
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $csp always;
        add_header Strict-Transport-Security "max-age=15768000" always;
        expires off;
    }

    # index.html / the PWA manifest are stable-named and reference content-hashed
    # bundles — they must always be revalidated so a new deploy's hashes are
    # picked up. (try_files in `location /` serves index.html; this exact-match
    # block also covers a direct /index.html hit.)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy $csp always;
        add_header Strict-Transport-Security "max-age=15768000" always;
        expires off;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $csp always;
        add_header Strict-Transport-Security "max-age=15768000" always;
        expires off;
    }

    # Wake-word models are STABLE-NAMED (renfield_de.onnx, etc.) but their CONTENT
    # changes when a model is retrained — so they must NOT be immutable-cached, or a
    # browser serves a stale model for a year (same trap as sw.js — see
    # reference_pwa_sw_nocache_nginx). no-cache = revalidate every load (ETag → cheap
    # 304 when unchanged, fresh 200 when a model is updated). The ^~ prefix match
    # wins over the generic `.onnx` immutable regex below.
    location ^~ /wakeword-models/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $csp always;
        add_header Strict-Transport-Security "max-age=15768000" always;
        expires off;
    }

    # .mjs files must be served as JavaScript modules (ONNX Runtime WASM loader)
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache static assets (content-hashed bundles → safe to cache forever)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm|onnx|mjs)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /api and /ws are backend routes (ingress-routed). If one ever reaches the
    # frontend (mis-route / ingress reload), return a non-cacheable 404 instead
    # of the SPA index.html — a cached HTML body for an API path replays as a
    # non-JSON response and crashes the SPA. (/health stays the frontend probe.)
    location ~ ^/(api|ws)(/|$) {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    # SPA routing - serve index.html for all routes. The shell must not be
    # HTTP-cached (it references content-hashed bundles); revalidate so a new
    # deploy is picked up without a manual cache clear.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        # Re-declare security headers (location-level add_header drops inherited).
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy $csp always;
        add_header Strict-Transport-Security "max-age=15768000" always;
        expires off;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
