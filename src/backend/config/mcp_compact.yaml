# MCP Response Compaction Rules
# Whitelist of fields to keep per MCP server/tool combination.
# Tools not listed here pass through uncompacted.
#
# Syntax:
#   server_name:
#     tool_name:
#       - simple_field
#       - nested.field
#       - array[].field
#
# A rule is written against the tool's CURRENT response shape and breaks
# silently when the MCP server wraps its answer differently. Every rule here
# therefore has a recorded response shape in tests/backend/test_mcp_compact.py
# (RECORDED_SHAPES), built from the MCP source — add one with each new rule.
# A rule that reduces a non-empty payload to nothing falls back to the
# uncompacted payload and logs a WARNING (services/mcp_compact.py).
# Keep "error" in each rule: an error envelope must reach the agent intact.

paperless:
  # renfield-mcp-paperless (pinned in requirements.txt) answers
  # {"summary": {...}, "results": [{...}, ...]}; tags are resolved names.
  search_documents:
    - error
    - summary
    - results[].id
    - results[].title
    - results[].created
    - results[].correspondent
    - results[].document_type
    - results[].tags
    - results[].page_count
    - results[].snippet

n8n:
  # n8n-mcp (pinned in src/backend/Dockerfile) answers
  # {"success": true, "data": {"workflows": [...], "returned": N, ...}}.
  n8n_list_workflows:
    - success
    - error
    - data.workflows[].id
    - data.workflows[].name
    - data.workflows[].active
    - data.workflows[].updatedAt
    - data.returned
    - data.hasMore
    - data.nextCursor
