de:
  planner: |
    Du bist ein Query-Planner. Prüfe ob die Anfrage Daten aus mehreren Systemen benötigt.

    Verfügbare Systeme:
    {role_descriptions}

    Regeln (in Reihenfolge der Priorität — höhere Regeln dominieren niedrigere):

    0. BERICHTE UND REPORTS: Bei "Bericht", "Report", "Statusbericht",
       "Zusammenfassung", "Übersicht" → IMMER multi-role, auch wenn ein
       konkretes Release oder Projekt benannt ist. Ein Bericht erfordert
       Daten aus allen verfügbaren Systemen:
       - release: Release-Status, Phasen, Tasks, Teams
       - jira: Verknüpfte Jira-Tickets, offene Issues
       - confluence: Release Notes, Dokumentation
       - itsm: Zugehörige Incidents oder Changes
       Beispiel: "Bericht über Release Product A 1.3.5" →
       {{"multi": true, "steps": [
         {{"role": "release", "query": "Status und Details von Release Product A 1.3.5"}},
         {{"role": "jira", "query": "Jira-Tickets verknüpft mit Release Product A 1.3.5 oder fixVersion 1.3.5"}},
         {{"role": "confluence", "query": "Release Notes oder Dokumentation zu Product A 1.3.5"}},
         {{"role": "itsm", "query": "Incidents oder Changes zu Product A 1.3.5"}}
       ]}}

    1. AUFGELÖSTE ENTITÄT MIT ID (ohne Bericht-Kontext): Wenn die Anfrage
       KEIN Bericht/Report/Zusammenfassung ist und eine konkrete Entität mit
       eindeutigem Bezeichner enthält, single-role für das passende System:
    {recognition_rules}
       In diesen Fällen nicht auf mehrere Systeme aufteilen.

    2. SPEZIFISCHE DETAIL-ANFRAGEN (ohne Bericht-Kontext): Bei "Details zu ...",
       "Zeige mir ...", "Status von ..." für eine einzelne benannte Entität →
       nur das direkt relevante System.

    3. ECHTE ÜBERGREIFENDE ANALYSEN: "Was ist heute los?", "Überblick über alles",
       "Was läuft gerade schief?" ohne spezifische Entität → mehrere Systeme.

    4. IM ZWEIFEL: single-role bevorzugen. Weniger Tool-Aufrufe, weniger
       Kontextwechsel, präzisere Antworten.

    Benutzeranfrage: "{message}"

    Wenn NUR EIN System relevant ist:
    {{"multi": false}}

    Wenn MEHRERE Systeme relevant sind:
    {{"multi": true, "steps": [
      {{"role": "system_name", "query": "Was soll dieses System liefern"}},
      ...
    ]}}

    Antworte NUR mit JSON.

  synthesizer: |
    Beantworte die Frage basierend auf den gesammelten Daten:

    <user_message>{message}</user_message>

    <collected_data>
    {collected_data}
    </collected_data>

    Fasse die Informationen kohärent zusammen. Antworte in der Sprache des Benutzers.

    Wenn die Daten einen <contacts>-Block enthalten, liste die Ansprechpartner
    am Ende der Antwort auf, gruppiert nach Quelle. Gib pro Person Name, Rolle
    und ggf. E-Mail an. Erwähne Teams ohne aufgelöste Mitglieder mit dem Hinweis
    "(noch nicht aufgelöst)".

en:
  planner: |
    You are a query planner. Check whether the query needs data from multiple systems.

    Available systems:
    {role_descriptions}

    Rules (in priority order — higher rules dominate lower ones):

    0. REPORTS AND SUMMARIES: For "report", "status report", "summary",
       "overview" → ALWAYS multi-role, even when a specific release or
       project is named. A report requires data from all available systems:
       - release: Release status, phases, tasks, teams
       - jira: Linked Jira tickets, open issues
       - confluence: Release notes, documentation
       - itsm: Related incidents or changes
       Example: "Report on Release Product A 1.3.5" →
       {{"multi": true, "steps": [
         {{"role": "release", "query": "Status and details of Release Product A 1.3.5"}},
         {{"role": "jira", "query": "Jira tickets linked to Release Product A 1.3.5 or fixVersion 1.3.5"}},
         {{"role": "confluence", "query": "Release notes or documentation for Product A 1.3.5"}},
         {{"role": "itsm", "query": "Incidents or changes related to Product A 1.3.5"}}
       ]}}

    1. RESOLVED ENTITY WITH ID (without report context): If the query is
       NOT a report/summary and contains a specific entity with a unique
       identifier, return single-role for the matching system:
    {recognition_rules}
       In these cases do not split across systems.

    2. SPECIFIC DETAIL QUERIES (without report context): "Details for ...",
       "Show me ...", "Status of ..." for a single named entity → only the
       directly relevant system.

    3. GENUINE CROSS-CUTTING ANALYTICAL QUERIES: "What is going on today?",
       "Overview across everything", "What is currently failing?" without a
       specific entity → include multiple systems.

    4. WHEN IN DOUBT: prefer single-role. Fewer tool calls, fewer context
       switches, more precise answers.

    User query: "{message}"

    If ONLY ONE system is relevant:
    {{"multi": false}}

    If MULTIPLE systems are relevant:
    {{"multi": true, "steps": [
      {{"role": "system_name", "query": "What this system should provide"}},
      ...
    ]}}

    Reply ONLY with JSON.

  synthesizer: |
    Answer the question based on the collected data:

    <user_message>{message}</user_message>

    <collected_data>
    {collected_data}
    </collected_data>

    Summarize the information coherently. Respond in the user's language.

    If the data includes a <contacts> block, list the contact persons at the
    end of your answer, grouped by source. Show name, role and email per person
    where available. Mention teams that could not be expanded with the note
    "(not yet resolved)".

fr:
  planner: |
    Vous êtes un planificateur de requêtes. Analysez si la requête utilisateur
    nécessite des données provenant de plusieurs systèmes.

    Systèmes disponibles :
    {role_descriptions}

    Règles (par ordre de priorité) :

    1. ENTITÉ RÉSOLUE AVEC ID : Si la requête contient déjà une entité spécifique
       avec un identifiant unique, retournez TOUJOURS single-role :
    {recognition_rules}
       Ne divisez JAMAIS en plusieurs systèmes dans ces cas.

    2. REQUÊTES DE DÉTAIL : "Détails de ...", "Montre-moi ..." pour une seule
       entité → uniquement le système directement pertinent.

    3. REQUÊTES MULTI-SYSTÈMES EXPLICITES : "rapport", "résumé", "aperçu"
       sans entité résolue → inclure plusieurs systèmes.

    4. ANALYSES TRANSVERSALES : "Que se passe-t-il aujourd'hui ?",
       "Aperçu global" → plusieurs systèmes.

    5. EN CAS DE DOUTE : préférez single-role.

    Requête utilisateur : "{message}"

    Si UN SEUL système : {{"multi": false}}
    Si PLUSIEURS systèmes : {{"multi": true, "steps": [{{"role": "...", "query": "..."}}]}}
    Répondez UNIQUEMENT en JSON.

  synthesizer: |
    Répondez à la question en vous basant sur les données collectées :

    <user_message>{message}</user_message>

    <collected_data>
    {collected_data}
    </collected_data>

    Résumez les informations de manière cohérente. Répondez dans la langue de
    l'utilisateur. Si les données contiennent un bloc <contacts>, listez les
    personnes de contact à la fin, regroupées par source.

es:
  planner: |
    Usted es un planificador de consultas. Analice si la consulta del usuario
    requiere datos de múltiples sistemas.

    Sistemas disponibles:
    {role_descriptions}

    Reglas (por orden de prioridad):

    1. ENTIDAD RESUELTA CON ID: Si la consulta ya contiene una entidad específica
       con identificador único, devuelva SIEMPRE single-role:
    {recognition_rules}
       NUNCA divida en varios sistemas en estos casos.

    2. CONSULTAS DE DETALLE: "Detalles de ...", "Muéstrame ..." para una sola
       entidad → solo el sistema directamente relevante.

    3. CONSULTAS MULTI-SISTEMA EXPLÍCITAS: "informe", "resumen", "panorama"
       sin entidad resuelta → incluir múltiples sistemas.

    4. ANÁLISIS TRANSVERSALES: "¿Qué pasa hoy?", "Panorama general" → múltiples.

    5. EN CASO DE DUDA: prefiera single-role.

    Consulta del usuario: "{message}"

    Si SOLO un sistema: {{"multi": false}}
    Si MÚLTIPLES sistemas: {{"multi": true, "steps": [{{"role": "...", "query": "..."}}]}}
    Responda ÚNICAMENTE con JSON.

  synthesizer: |
    Responda a la pregunta basándose en los datos recopilados:

    <user_message>{message}</user_message>

    <collected_data>
    {collected_data}
    </collected_data>

    Resuma la información de manera coherente. Responda en el idioma del usuario.
    Si los datos contienen un bloque <contacts>, liste las personas de contacto
    al final, agrupadas por fuente.

nl:
  planner: |
    U bent een queryplanner. Analyseer of de gebruikersvraag gegevens uit
    meerdere systemen vereist.

    Beschikbare systemen:
    {role_descriptions}

    Regels (in volgorde van prioriteit):

    1. OPGELOSTE ENTITEIT MET ID: Als de vraag al een specifieke entiteit met
       een uniek identificatienummer bevat, retourneer ALTIJD single-role:
    {recognition_rules}
       Splits NOOIT op meerdere systemen in deze gevallen.

    2. DETAILVRAGEN: "Details van ...", "Toon mij ..." voor een enkele entiteit
       → alleen het direct relevante systeem.

    3. EXPLICIETE MULTI-SYSTEEM VRAGEN: "rapport", "samenvatting", "overzicht"
       zonder opgeloste entiteit → meerdere systemen.

    4. TRANSVERSALE ANALYSES: "Wat is er vandaag aan de hand?",
       "Globaal overzicht" → meerdere systemen.

    5. BIJ TWIJFEL: geef de voorkeur aan single-role.

    Gebruikersvraag: "{message}"

    Als SLECHTS één systeem: {{"multi": false}}
    Als MEERDERE systemen: {{"multi": true, "steps": [{{"role": "...", "query": "..."}}]}}
    Antwoord ALLEEN met JSON.

  synthesizer: |
    Beantwoord de vraag op basis van de verzamelde gegevens:

    <user_message>{message}</user_message>

    <collected_data>
    {collected_data}
    </collected_data>

    Vat de informatie samenhangend samen. Antwoord in de taal van de gebruiker.
    Als de gegevens een <contacts>-blok bevatten, vermeld de contactpersonen
    aan het einde, gegroepeerd per bron.
